[pytest]
# `tests/experimental` keeps `pytest tests/` (stable lanes) from recursing into
# the experimental tree; an explicit `pytest tests/experimental/` still collects
# it. Path-anchored rather than the bare basename `experimental`, which matches a
# directory of that name anywhere -- flashinfer already has one at
# flashinfer/gdn_kernels/experimental, so a future tests/<area>/experimental/
# would have been skipped without a word.
norecursedirs = test_helpers tests/experimental
addopts = --import-mode=importlib
