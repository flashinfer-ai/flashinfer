[local]
package = "flashinfer.attention.prims_ts.kernels"
restoration_status = "implemented: full upstream feature graph is restored with additive native-CSR, public-scale, producer-only CGA split-CTA without a redundant tail rendezvous, 2-KiB reducer-slice, adaptive CGA owner waiting, converged predicated FP8 paged TMA issue, one-wave auto-CGA, runtime-paged domain-cache, native split page-window lifetime, Swaps H256 shared-KV-ring, FP8-to-FP8 D256 output overlays, paged FP8 grouped-Keeps cost profiles, fixed-Q1 grouped-Keeps output-guard masking, general fixed-full-tile grouped-Keeps capability, and empirical joint Swaps/Keeps TileQ/split launch selection, plus the FlashInfer-owned standalone plan/run runtime and one-shot wrapper"
profile_revision = "upstream-policy-restored-plan-run-v13-grouped-q-joint-launch-selection"
target_kernel_abi_revision = "attention-ts-decode-native-csr-v2-token-major-o"
packaged_kernel_abi = "additive native FlashInfer CSR page mapping with plan-derived canonical seq_lens; fixed multi-Q input/output are token-major [B,SQ,Hq,D], packed variable-Q input/output remain [sumQ,Hq,D]; native KV uses shared K/V page IDs, runtime physical capacity, and independent signed-64 K/V outer page strides; legacy paging is preserved"
native_csr_implemented = true
public_scale_integration = "implemented: effective bmm1_scale uses the existing score-scale path; bmm2_scale is applied exactly once by every final-output route while split partial O remains unscaled"
runtime_validation = "plan/run validated with all compiler/runtime components resolved from the feature2 DKG build: restored upstream policy coverage; 26/26 focused DKG automatic-CGA policy tests; complete public decode 57/57; public FP8 D256 native page-window coverage for page sizes 16/32/64/128, ragged runtime lengths, and exact B4 lower-split graph replay (6/6); final all-runtime-span eligibility gate 1/1; all 52 formerly slower public cold-L2 one-call graph rows passed correctness with zero rows above 5% and a +3.6797% worst residual; the final public cross-feature gate passed 14/14; CPU release/benchmark hygiene passed 15/15; and exact mirrored-DKG B128 persistent plus B1 CGA split16 standalone references and filtered synccheck passed with zero sanitizer errors. Earlier native/legacy, reducer, runtime-length, standalone DKG, and D256 evidence remains recorded in the ledgers."
grouped_keeps_validation = "78/78 public ratio-32 TileQ64/128 cost candidates resolved through the production factory; 6/6 path-complete public plan/run pytest cases passed eager reuse and CUDA-graph replay; final mask-optimization timing passed 63/63 pre/post-graph correctness blocks and 6/6 non-aligned tails; strict single-tile D256 P448 checks passed both TileQ64 legacy-mask and TileQ128 guarded-output schedules; heterogeneous-batch guarded direct and ragged split exception cases passed; a ratio-5 grouped FP16 launch exercised the CuTe fast-divmod fallback; the general fixed-full-tile factory matrix covers SQ4/SQ8 and direct/inline/standalone modes; 235 timed B300 candidate pairs plus 6 SQ8/SQ16 geometry pairs passed P448 or IEEE-FP32 correctness. The joint selector adds a complete 20-cell FP8 B/ratio/K CPU policy matrix, explicit-control regressions, a 110/110 complete FMHA decode suite, and six B200 matched-input cases whose 26 recipes passed eager plus poisoned-graph P448/FP32 checks with all 42 recorded GMEM counter checks zero."
grouped_keeps_performance = "the original partial fixed-Q1 ratio-32 comparison remains cost-model training evidence; the later equal-full-tile direct candidate matrix uses paired cold-L2 one-call CUDA graphs on B300 and matched 60/60 FP8 best candidates plus 19/20 FP16 best candidates with 2.865% maximum regret. The approved joint selector reuses TRTLLM-gen da589566 empirical TileQ mainloop/reduction factors while enumerating TS-legal fanouts. Six representative B200 K8/D128 cold-L2 graph cases selected within 0.1% of the measured best in five 100-sample rows; the one bimodal duplicate-config row was confirmed with 1,000 samples at 0.713% regret. Explicit profiles remain pinned and no shape whitelist or public knob is introduced."
known_correctness_limitation = "the inherited split-head-dimension paged+window schedule used by the remaining Keeps/instruction-local path can stage a 32-ID window from K0/V0 while K1/V1 straddles into the next window; the qualified Swaps D256 and current no-window validation are unaffected"
known_performance_limitation = "the retained native split fast path holds one 32-ID page window only when every possible runtime split-local span fits and aligns within that window; other native and all generic DKG paged profiles retain the original per-load handoff. The joint grouped-Q proxy currently reuses FP8-derived TRTLLM-gen factors for every dtype, does not model the second standalone-reducer kernel or persistent scheduling, and has only a six-shape B200 post-change timing sample; the prior broad B300 direct/split matrices remain historical evidence rather than a post-change full sweep. In the earlier rerun of all 52 formerly slower public decode rows, none was above 5%."
