[approval]
status = "approved"
scope = "Vendoring and preparation for public release"
reference = "Integration-plan review, user decision 4: approve entirely (2026-07-01)"
license = "LicenseRef-NvidiaProprietary"
header_treatment = "Preserve SPDX copyright/license and proprietary notice; remove non-license nv-internal-release template markers"
change_control = "Narrow initial tests do not authorize source feature removal or heuristic changes; obtain project-owner approval before either."
heuristic_approval = "Project owner approved replacing the shape whitelist with general automatic CGA eligibility on 2026-07-02 and approved changing the heuristic: starting at the ordinary auto split, select the largest legal split whose complete cluster grid fits one wave; preserve positive explicit fanout and explicit launch modes; no public tuning knob is introduced."
reducer_slice_approval = "Project owner approved matching TRTLLM-gen's minimum inline-reducer unit on 2026-07-02: 128 correction threads x 16 bytes per thread for both in-kernel GMEM and CGA ownership; no public tuning knob is introduced."
runtime_seqlen_approval = "Project owner directed fixing the dynamic/runtime sequence-length regression on 2026-07-02 while retaining one general runtime callable; the implementation caches task-invariant sequence/CSR/raw-tile geometry and streamlines the runtime-paged non-split tail load, with no planner specialization, heuristic change, or tuning knob."
grouped_keeps_approval = "Project owner directed enabling grouped tokens/heads for every public ratio-32 TileQ64/128 Keeps-MMA-AB cost-model profile on 2026-07-07; the change widens the existing paged FP8 capability family without changing launch heuristics or kernel algorithms."
grouped_keeps_mask_approval = "Project owner approved optimizing grouped Keeps masking on 2026-07-07: qualified fixed-Q1 profiles may rely on existing guarded publication instead of masking independent inactive score rows on every KV tile; retain structurally distinct schedules when silicon regresses; no launch heuristic or tuning knob is introduced."
grouped_keeps_q4_approval = "Project owner directed a B300 comparison between equal full Q tiles on 2026-07-07: ungrouped Hq=TileQ/SQ1 versus grouped Hq=TileQ/4/SQ4; the capability delta admits only exact fixed full-tile SQ4 geometry and changes no heuristic or public knob."
grouped_q_mma_selection_approval = "Project owner explicitly directed on 2026-07-07 that the seqlen-Q>1 heuristic consider KeepsMmaAb for TileQ above 32, validate legal combinations for accuracy and performance, and modify the heuristic to support them. The retained implementation generalizes fixed complete grouped-Q tiles, uses a direct physical-wave service rule, preserves explicit MMA/launch/fanout requests, and exposes no public knob."
grouped_q_joint_launch_approval = "Project owner explicitly approved on 2026-07-07 that automatic grouped-Q selection always consider splitting KV when launch capacity is idle and directed reusing TRTLLM-gen FmhaAutoTuner.cpp empirical factors where useful. The retained TS policy jointly ranks every production-valid full-Q-tile direct and useful one-wave/first-crossing split recipe with the da589566 empirical mainloop/reduction proxy, keeps TS profile and measured TileQ restrictions, preserves explicit fields, and exposes no public knob."

