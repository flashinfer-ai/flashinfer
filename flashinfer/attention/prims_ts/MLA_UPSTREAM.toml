[[deltas]]
id = "mla-valid-lse-row-publication"
status = "1CTA LSE and O publication reject padded correction rows before direct, GMEM-partial, or CGA stores, preventing tile-Q8 multi-head races without changing launch policy."
files = [
  "flashinfer/attention/prims_ts/kernels/mla_decode/throughput_latency_1cta/resources/tmem_corr.py",
]
ledger = "KERNEL_CHANGES.md"

[[deltas]]
id = "mla-bf16-2cta-gap-closure"
status = "BF16 2CTA uses BF16 row-packed split partials, an eight-row PDL reducer, a greater-than-one-wave CTA0-only CLC scheduler with query-major rastering, and omits only the redundant post-tcgen05.alloc cluster barrier; FP8, one-wave, explicit-policy, paged-cache, LSE, and pre-allocation synchronization capabilities remain."
