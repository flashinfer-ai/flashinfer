name: PR Documentation Summary

on:
  workflow_run:
    workflows: ["PR Documentation Checks"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  comment:
    concurrency:
      group: pr-documentation-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion != 'skipped'
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      DOC_FIX_API_RST_MISSING: |
        Add the public name to the appropriate `docs/api/*.rst` page under its `.. currentmodule::` and `.. autosummary::` (or use `.. autofunction::`). Verify the name is exported by that module. If a new page is needed, also add it to the `docs/index.rst` toctree.
      DOC_FIX_API_RST_STALE: |
        Verify the symbol's definition and public exports before changing the docs. If it was removed or renamed, update the RST entry to the current public name. If it is still exported without `@flashinfer_api`, this may be a checker limitation: explain that evidence rather than deleting valid docs or adding a decorator just to silence the warning.
      DOC_FIX_DOCSTRING_COMPLETENESS: |
        Edit the reported function's docstring. Keep the existing contract and add a structured NumPy `Parameters` section (or Google `Args:`) documenting each explicit argument's meaning, type, shapes, constraints and default, as applicable. Replace the placeholders in this template with facts from the implementation:

        ```python
        Parameters
        ----------
        argument_name : actual_type
            Describe the argument and its actual default and constraints.
        ```
      DOC_FIX_ARGS_CONSISTENCY: |
        In the reported function's docstring, add a separate NumPy parameter entry for each listed argument, or Google `Args:` entries such as `argument_name (actual_type): description`. Check the signature and implementation for the actual types, defaults and meaning.

        Do not mix ordinary names and `**knobs` / `**options` in one parameter heading: give the keyword dictionary its own entry. Template (replace placeholders; include `**knobs` only if accepted):

        ```python
        Parameters
        ----------
        argument_name : actual_type
            Meaning, shape, constraints and default.
        **knobs
            Additional keyword options accepted by this function.
        ```
      DOC_FIX_ENV_VARS_CONSISTENCY: |
        Add the reported variable to the appropriate section of `docs/development/environment_variables.md`, linked from `AGENTS.md`. Read the reported source location to establish its purpose, accepted values, default when unset, and when it is read. Match the existing table's columns and record those facts; do not guess the default.

        Row template (replace the variable, value and description):

        ```markdown
        | Variable | Default | Read in | Effect |
        | --- | --- | --- | --- |
        | `FLASHINFER_EXAMPLE` | Verified unset default | `flashinfer/example.py` | Describe purpose, accepted values and when read |
        ```

        Example setting: `export FLASHINFER_EXAMPLE=example_value`.
      DOC_FIX_SUPPORTED_ARCH_CONSISTENCY: |
        Compare the **Architecture guards** list in `docs/development/testing.md` with `is_sm*_supported()` and the relevant `supported_major_versions` declarations. Correct the source that is out of date using actual implemented support; do not claim hardware support merely to satisfy the checker.
      DOC_FIX_QUICKREF_PATHS_EXIST: |
        Correct the referenced path in the reported Markdown file (`AGENTS.md` or its linked development references) to an existing repository-relative path, or remove the obsolete reference if the file was intentionally deleted. Verify the file exists; do not create an empty file just to satisfy the check.
      DOC_FIX_SKILL_REFS_EXIST: |
        Edit the reported skill Markdown reference to point to the existing file, resolving relative paths from that skill's directory. Remove an obsolete reference only if the referenced capability was intentionally removed.
      DOC_FIX_DOCS_INDEX_REFS_EXIST: |
        Fix the reported `docs/index.rst` toctree entry so it resolves to an existing `.rst` page under `docs/`. If the page moved, update its path; if the entry was added before the page, add the intended page with real content.
    steps:
      - name: Resolve pull request number
        id: pr
        uses: actions/github-script@v7
        env:
          CANDIDATE_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          result-encoding: string
          script: |
            const candidate = String(process.env.CANDIDATE_PR || '').trim();
            const { owner, repo } = context.repo;
            const headSha = process.env.HEAD_SHA;
            if (/^[1-9][0-9]*$/.test(candidate)) {
              try {
                const { data: candidatePr } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: Number(candidate),
                });
                if (candidatePr.state === 'open' && candidatePr.head.sha === headSha) {
                  return candidate;
                }
                core.info(`Ignoring stale pull request candidate #${candidate}`);
              } catch (error) {
                core.warning(`Could not validate pull request #${candidate}: ${error.message}`);
              }
            }

            const headRepository = process.env.HEAD_REPOSITORY || `${owner}/${repo}`;
            const [headOwner, headRepo] = headRepository.split('/', 2);
            let associated = [];
            try {
              const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: headOwner,
                repo: headRepo,
                commit_sha: headSha,
              });
              associated = response.data;
            } catch (error) {
              core.warning(`Could not query associated PRs in ${headRepository}: ${error.message}`);
            }
            let matches = associated.filter((pr) =>
              pr.state === 'open'
              && pr.head.sha === headSha
              && pr.base.repo.full_name === `${owner}/${repo}`
            );
            if (!matches.length) {
              const openPullRequests = await github.paginate(github.rest.pulls.list, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
              matches = openPullRequests.filter((pr) => pr.head.sha === headSha);
            }
            const pullRequest = matches.find((pr) => pr.base.ref === 'main') || matches[0];
            if (!pullRequest) {
              core.warning(`No open pull request found for workflow head ${headSha}`);
              return '';
            }
            return String(pullRequest.number);

      - name: Download untrusted report data
        if: steps.pr.outputs.result != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pr-documentation-report
          path: reports
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Update PR documentation summary
        if: steps.pr.outputs.result != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.result }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- flashinfer-pr-documentation-summary -->';
            const prNumber = Number(process.env.PR_NUMBER);
            const runUrl = process.env.RUN_URL;
            const { owner, repo } = context.repo;
            const escape = (value) => String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/\r?\n/g, ' ')
              .slice(0, 500);
            const fixFor = (finding) => process.env[`DOC_FIX_${String(finding.check).toUpperCase()}`]?.trim()
              || 'Check the reported source location and update the corresponding documentation to match the implementation.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber, per_page: 100,
            });
            const previous = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]'
              && comment.body.includes(marker)
            );
            const publicApiFindings = [];
            const documentationFindings = [];
            const reportErrors = [];
            const reportTargets = [
              ['reports/public-api.json', publicApiFindings],
              ['reports/static-documentation.json', documentationFindings],
            ];
            for (const [file, target] of reportTargets) {
              if (!fs.existsSync(file)) {
                reportErrors.push(`${file} is missing`);
                continue;
              }
              try {
                const report = JSON.parse(fs.readFileSync(file, 'utf8'));
                for (const finding of report.findings || []) target.push(finding);
              } catch (error) {
                core.warning(`Ignoring malformed report ${file}: ${error.message}`);
                reportErrors.push(`${file} is malformed`);
              }
            }
            let executionStatus = {};
            if (fs.existsSync('reports/execution-status.json')) {
              try {
                executionStatus = JSON.parse(fs.readFileSync('reports/execution-status.json', 'utf8'));
              } catch (error) {
                reportErrors.push('execution-status.json is malformed');
              }
            } else {
              reportErrors.push('execution-status.json is missing');
            }
            const failedChecks = Object.entries(executionStatus)
              .filter(([, outcome]) => outcome !== 'success')
              .map(([name]) => name);
            const findings = [...publicApiFindings, ...documentationFindings];
            const hasProblems = Boolean(
              findings.length || failedChecks.length || reportErrors.length
            );
            if (!hasProblems) {
              if (previous) {
                await github.rest.issues.deleteComment({
                  owner,
                  repo,
                  comment_id: previous.id,
                });
                core.info('Documentation findings resolved; removed the existing summary.');
              } else {
                core.info('Clean PR with no existing documentation summary; no comment needed.');
              }
              return;
            }
            const publicRows = publicApiFindings.slice(0, 20);
            const documentationRows = documentationFindings.slice(0, 20);
            const sections = [marker];
            if (publicApiFindings.length) {
              sections.push(
                '# 🚨 POTENTIAL API BREAK 🚨',
                '',
                '> [!CAUTION]',
                '> **THIS PR APPEARS TO BREAK THE PUBLIC API. AUTHORS AND REVIEWERS: DO NOT MISS THIS.**',
                '>',
                '> This is an advisory warning and does not gate merging. Confirm compatibility and provide a deprecation or migration path, or track the fix in a follow-up PR.',
                '',
                `${publicApiFindings.length} public API finding(s):`,
                '',
                publicRows.map((f) => `- \`${escape(f.path)}:${Number(f.line) || 1}\` — ${escape(f.message)}`).join('\n'),
              );
            }
            if (documentationFindings.length) {
              sections.push(
                '## Documentation checks ⚠️',
                '',
                `${documentationFindings.length} new documentation finding(s):`,
                '',
                documentationRows.map((f) => [
                  `- \`${escape(f.path)}:${Number(f.line) || 1}\` — ${escape(f.message)}`,
                  '',
                  '  **How to fix:**',
                  ...fixFor(f).split('\n').map((line) => `  ${line}`),
                ].join('\n')).join('\n\n'),
              );
            }
            if (failedChecks.length || reportErrors.length) {
              const problems = [
                ...failedChecks.map((name) => `${name} did not complete`),
                ...reportErrors,
              ];
              sections.push(
                '# 🚨 ADVISORY CHECKER REPORT IS INCOMPLETE 🚨',
                '',
                '> [!WARNING]',
                `> ${escape(problems.join('; '))}. The checker remains non-blocking, but this run must not be treated as a clean result.`,
              );
            }
            sections.push('', `[View the full check run](${runUrl})`);
            const body = sections.join('\n');
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            }

      - name: Post inline documentation findings
        if: steps.pr.outputs.result != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.result }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const marker = 'flashinfer-pr-documentation-inline';
            const prNumber = Number(process.env.PR_NUMBER);
            const escape = (value) => String(value)
              .replace(/&/g, '&amp;')
              .replace(/</g, '&lt;')
              .replace(/>/g, '&gt;')
              .replace(/\r?\n/g, ' ')
              .slice(0, 500);
            const fixFor = (finding) => process.env[`DOC_FIX_${String(finding.check).toUpperCase()}`]?.trim()
              || 'Check the reported source location and update the corresponding documentation to match the implementation.';
            const documentationBody = (finding, key) => `<!-- ${marker} --><!-- key:${key} -->\n⚠️ **Documentation check:** ${escape(finding.message)}\n\n**How to fix:**\n${fixFor(finding)}`;
            const findings = [];
            for (const [file, category] of [
              ['reports/public-api.json', 'public_api'],
              ['reports/static-documentation.json', 'documentation'],
            ]) {
              if (!fs.existsSync(file)) continue;
              try {
                const report = JSON.parse(fs.readFileSync(file, 'utf8'));
                findings.push(...(report.findings || []).map((finding) => ({
                  ...finding,
                  category,
                })));
              } catch (error) {
                core.warning(`Ignoring malformed report ${file}: ${error.message}`);
              }
            }
            const { owner, repo } = context.repo;
            const [pr, changedFiles, existingComments] = await Promise.all([
              github.rest.pulls.get({ owner, repo, pull_number: prNumber }),
              github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 }),
              github.paginate(github.rest.pulls.listReviewComments, { owner, repo, pull_number: prNumber, per_page: 100 }),
            ]);
            const changedPaths = new Set(changedFiles.map((file) => file.filename));
            const existingByKey = new Map(
              existingComments
                .filter((comment) =>
                  comment.user?.login === 'github-actions[bot]'
                  && comment.body.includes(marker)
                )
                .map((comment) => [comment.body.match(/<!-- key:(.*?) -->/)?.[1], comment])
                .filter(([key]) => key),
            );
            const candidates = [];
            const candidateKeys = new Set();
            const updates = new Map();
            for (const finding of findings) {
              const path = String(finding.path || '');
              const line = Number(finding.line);
              const key = crypto.createHash('sha256')
                .update(JSON.stringify([finding.check, path, finding.message]))
                .digest('hex');
              if (!path || !Number.isInteger(line) || line < 1 || !changedPaths.has(path)) continue;
              const existing = existingByKey.get(key);
              if (existing && finding.category === 'documentation') {
                const body = documentationBody(finding, key);
                if (existing.body !== body) {
                  updates.set(existing.id, { owner, repo, comment_id: existing.id, body });
                }
              }
              if (!existing && !candidateKeys.has(key)) {
                candidates.push({ finding, key, path, line });
                candidateKeys.add(key);
              }
            }
            for (const update of [...updates.values()].slice(0, 20)) {
              try {
                await github.rest.pulls.updateReviewComment(update);
              } catch (error) {
                core.warning(`Could not update documentation guidance: ${error.message}`);
              }
            }
            const reviewComments = candidates.slice(0, 20).map(
              ({ finding, key, path, line }) => ({
                path,
                line,
                side: 'RIGHT',
                body: finding.category === 'public_api'
                  ? `<!-- ${marker} --><!-- key:${key} -->\n🚨🚨🚨 **POTENTIAL BREAKING PUBLIC API CHANGE:** ${escape(finding.message)}`
                  : documentationBody(finding, key),
              })
            );
            if (!reviewComments.length) {
              core.info('No new inline documentation findings to post.');
              return;
            }
            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number: prNumber,
                commit_id: pr.data.head.sha,
                event: 'COMMENT',
                body: `<!-- ${marker} -->\n${reviewComments.length} new documentation finding(s) generated from the static PR check.`,
                comments: reviewComments,
              });
            } catch (error) {
              core.warning(`Could not post inline documentation review: ${error.message}`);
              // A line may no longer be commentable after a concurrent push.
              // Retry individually so one stale location does not hide the rest.
              for (const comment of reviewComments) {
                try {
                  await github.rest.pulls.createReview({
                    owner,
                    repo,
                    pull_number: prNumber,
                    commit_id: pr.data.head.sha,
                    event: 'COMMENT',
                    body: `<!-- ${marker} -->\nDocumentation finding generated from the static PR check.`,
                    comments: [comment],
                  });
                } catch (commentError) {
                  core.warning(
                    `Could not post inline finding for ${comment.path}:${comment.line}: ${commentError.message}`
                  );
                }
              }
            }
