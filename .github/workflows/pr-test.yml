# CI workflow using AWS self-hosted runners.
# Runs AOT build tests and GPU unit tests on push/PR to main.
# Uses ci/bash.sh for Docker execution (same as Jenkins).
#
# Permission Control:
# - Push to main: Always runs
# - PRs: run only when the 'run-ci' label is applied, for every contributor.
#   Applying the label is the trigger, so new commits need a new trigger:
#   @flashinfer-bot run. Only users with write access can apply labels.
#
# Instance Purchasing:
# - All runners are on-demand. Spot was removed.
# - A failure here is a real failure, so there is nothing to retry
#   automatically.
# - Matrices keep fail-fast: true. On-demand capacity is billed for as long as
#   it runs, so the first real failure should stop the sibling jobs.

name: PR Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      skip_aot:
        description: 'Skip AOT build tests'
        type: boolean
        default: false
      skip_gpu:
        description: 'Skip GPU tests'
        type: boolean
        default: false

concurrency:
  # A label other than run-ci can never start tests, so it gets its own group and
  # does not cancel - otherwise label churn would discard running GPU jobs.
  group: pr-test-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'run-ci') && '-noop' || '' }}
  cancel-in-progress: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'run-ci') }}

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  EXECUTOR_NUMBER: "0"
  SKIP_CI_PATTERNS: '\.md$|\.txt$|^docs/|^docker/|^licenses/|^LICENSE$|^NOTICE$|^benchmarks/|^\.github/CODEOWNERS$'

jobs:
  # ---------------------------------------------------------------------------
  # Gate - Check if PR is authorized to run CI
  # ---------------------------------------------------------------------------
  gate:
    name: Permission Check
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check authorization
        id: check
        env:
          # Read via env, not inlined: a label name is caller-supplied text.
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          # Always allow push to main and workflow_dispatch
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "Not a PR, authorized"
            exit 0
          fi

          # Authorize on run-ci being applied, not on it being present: presence
          # would re-authorize every later push, which is the auto-trigger this
          # gate removes. Applying a label needs write access, so this also holds
          # on fork PRs, where secrets are unavailable.
          if [[ "$EVENT_ACTION" == "labeled" && "$LABEL_NAME" == "run-ci" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "run-ci label applied, authorized"
            exit 0
          fi

          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "Not triggered by the run-ci label, skipping CI"

  # ---------------------------------------------------------------------------
  # Setup - Read docker tag and check if build should be skipped
  # ---------------------------------------------------------------------------
  setup:
    name: Setup
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.get-tag.outputs.tag }}
      skip_build: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Docker Tag
        id: get-tag
        run: |
          TAG=$(grep 'flashinfer/flashinfer-ci-cu129:' ci/docker-tags.yml | cut -d':' -f2 | tr -d ' ')
          if [ -z "$TAG" ]; then
            echo "::error::Failed to extract Docker tag from ci/docker-tags.yml"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Docker tag: $TAG"

      - name: Check Skip Conditions
        id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Use PR event SHAs for reliable diff (avoids issues with origin refs)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          # TODO (yongwww): Add back ^\.github/ before merging to main
          SKIP_PATTERNS="$SKIP_CI_PATTERNS"

          SKIP=true
          while IFS= read -r file; do
            if [ -n "$file" ] && ! echo "$file" | grep -qE "$SKIP_PATTERNS"; then
              SKIP=false
              break
            fi
          done <<< "$CHANGED"

          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          if [ "$SKIP" == "true" ]; then
            echo "::notice::Skipping build - only docs/config files changed"
          fi

  # ---------------------------------------------------------------------------
  # AOT Build Import Tests
  # ---------------------------------------------------------------------------
  aot-build-import:
    name: AOT Build Import (${{ matrix.arch }}, ${{ matrix.cuda }})
    needs: [gate, setup]
    if: |
      needs.gate.outputs.authorized == 'true' &&
      needs.setup.outputs.skip_build != 'true' &&
      github.event.inputs.skip_aot != 'true'
    runs-on:
      - self-hosted
      - linux
      - ${{ matrix.arch }}
      - cpu
      - on-demand
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        arch: [x64, arm64]
        cuda: [cu126, cu128, cu129, cu130]
    env:
      DOCKER_IMAGE: flashinfer/flashinfer-ci-${{ matrix.cuda }}:${{ needs.setup.outputs.docker_tag }}
    steps:
      - name: Cleanup
        run: |
          # Stop all Docker containers to free memory
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          # Clean workspace and caches
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Node Info
        run: ./scripts/task_show_node_info.sh
        env:
          NODE_NAME: ${{ runner.name }}
          WORKSPACE: ${{ github.workspace }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Run Test
        env:
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
        run: |
          bash ci/bash.sh "${DOCKER_IMAGE}" \
            -e SCCACHE_BUCKET "${SCCACHE_BUCKET}" \
            -e SCCACHE_REGION "${SCCACHE_REGION}" \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            --no-gpu ./scripts/task_test_jit_cache_package_build_import.sh

  # ---------------------------------------------------------------------------
  # GPU JIT Tests - SM86 (A10G)
  # ---------------------------------------------------------------------------
  gpu-tests-a10g:
    name: JIT Unittest ${{ matrix.shard }} (A10G)
    needs: [gate, setup]
    if: |
      needs.gate.outputs.authorized == 'true' &&
      needs.setup.outputs.skip_build != 'true' &&
      github.event.inputs.skip_gpu != 'true'
    runs-on: [self-hosted, linux, x64, gpu, sm86, on-demand]
    timeout-minutes: 360
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4, 5]
    env:
      DOCKER_IMAGE: flashinfer/flashinfer-ci-cu129:${{ needs.setup.outputs.docker_tag }}
    steps:
      - name: Cleanup
        run: |
          # Stop all Docker containers to free memory
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          # Clean workspace and caches
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true
          nvidia-smi || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Node Info
        run: ./scripts/task_show_node_info.sh
        env:
          NODE_NAME: ${{ runner.name }}
          WORKSPACE: ${{ github.workspace }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Run JIT Unittest Part ${{ matrix.shard }}
        run: bash ci/bash.sh ${DOCKER_IMAGE} ./scripts/task_jit_run_tests_part${{ matrix.shard }}.sh

  # ---------------------------------------------------------------------------
  # GPU JIT Tests - SM75 (T4)
  # ---------------------------------------------------------------------------
  gpu-tests-t4:
    name: JIT Unittest (T4)
    needs: [gate, setup]
    if: |
      needs.gate.outputs.authorized == 'true' &&
      needs.setup.outputs.skip_build != 'true' &&
      github.event.inputs.skip_gpu != 'true'
    runs-on: [self-hosted, linux, x64, gpu, sm75, on-demand]
    timeout-minutes: 360
    env:
      DOCKER_IMAGE: flashinfer/flashinfer-ci-cu129:${{ needs.setup.outputs.docker_tag }}
    steps:
      - name: Cleanup
        run: |
          # Stop all Docker containers to free memory
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          # Clean workspace and caches
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true
          nvidia-smi || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Node Info
        run: ./scripts/task_show_node_info.sh
        env:
          NODE_NAME: ${{ runner.name }}
          WORKSPACE: ${{ github.workspace }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Run JIT Unittest Part 3 (T4)
        run: bash ci/bash.sh ${DOCKER_IMAGE} ./scripts/task_jit_run_tests_part3.sh

  # ---------------------------------------------------------------------------
  # GPU JIT Tests - H100 (Hopper) - Capacity Block
  # Requires manually purchased CB via AWS Console
  # ---------------------------------------------------------------------------
  gpu-tests-h100:
    name: JIT Unittest (H100)
    needs: [gate, setup]
    if: |
      needs.gate.outputs.authorized == 'true' &&
      needs.setup.outputs.skip_build != 'true' &&
      github.event.inputs.skip_gpu != 'true'
    runs-on: [self-hosted, linux, x64, gpu, h100]
    timeout-minutes: 480
    env:
      DOCKER_IMAGE: flashinfer/flashinfer-ci-cu129:${{ needs.setup.outputs.docker_tag }}
    steps:
      - name: Cleanup
        run: |
          # Shared multi-runner node: only stop containers started by THIS runner (identified by workspace mount)
          for cid in $(docker ps -q); do
            if docker inspect "$cid" --format '{{json .Mounts}}' 2>/dev/null | grep -qF "${{ github.workspace }}/"; then
              docker stop "$cid" 2>/dev/null || true
            fi
          done
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker container prune -f 2>/dev/null || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true
          echo "CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES"
          nvidia-smi -i "$CUDA_VISIBLE_DEVICES" || true

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show Node Info
        run: ./scripts/task_show_node_info.sh
        env:
          NODE_NAME: ${{ runner.name }}
          WORKSPACE: ${{ github.workspace }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Run H100 Kernel Tests
        run: bash ci/bash.sh ${DOCKER_IMAGE} ./scripts/task_run_unit_tests.sh

  # ---------------------------------------------------------------------------
  # Test Results Summary
  # ---------------------------------------------------------------------------
  test-results-summary:
    name: Test Results Summary
    if: "!cancelled()"
    needs:
      - gate
      - setup
      - aot-build-import
      - gpu-tests-a10g
      - gpu-tests-t4
      - gpu-tests-h100
    runs-on: ubuntu-latest
    steps:
      - name: Check Authorization
        if: needs.gate.outputs.authorized != 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check skip patterns for unauthorized PRs
        if: needs.gate.outputs.authorized != 'true'
        id: skip-check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          SKIP_PATTERNS="$SKIP_CI_PATTERNS"

          SKIP=true
          while IFS= read -r file; do
            if [ -n "$file" ] && ! echo "$file" | grep -qE "$SKIP_PATTERNS"; then
              SKIP=false
              break
            fi
          done <<< "$CHANGED"

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Report unauthorized PR status
        if: needs.gate.outputs.authorized != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.skip-check.outputs.skip }}" == "true" ]; then
            echo "CI not required (docs/config only changes)" >> $GITHUB_STEP_SUMMARY
            echo "::notice::Docs-only PR — no CI needed"
            exit 0
          fi

          # Don't turn an already-passing commit red for an event that changed no
          # code - re-earning that green costs another full GPU run. A code change
          # produces a new SHA with no prior run, so this cannot report untested
          # code as passing.
          PASSED=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --commit "$HEAD_SHA" \
            --status success \
            --json databaseId --jq 'length' 2>/dev/null) || PASSED=0

          if [ "${PASSED:-0}" -gt 0 ]; then
            echo "CI already passed for this commit ($HEAD_SHA)" >> $GITHUB_STEP_SUMMARY
            echo "::notice::Keeping the passing result already recorded for this commit"
            exit 0
          fi

          echo "CI skipped (pending authorization)" >> $GITHUB_STEP_SUMMARY
          echo "A contributor in @flashinfer-ai/ci-users can comment \`@flashinfer-bot run\` to start CI." >> $GITHUB_STEP_SUMMARY
          echo "This is also needed after pushing new commits, since CI no longer starts on its own." >> $GITHUB_STEP_SUMMARY
          echo "::warning::CI skipped — pending authorization"
          exit 1

      - name: Check Results
        if: needs.gate.outputs.authorized == 'true'
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          # Helper function to check job status
          check_status() {
            local name=$1 skip=$2 result=$3
            echo "$name" >> $GITHUB_STEP_SUMMARY
            if [ "$skip" == "true" ]; then
              echo "- Status: Skipped" >> $GITHUB_STEP_SUMMARY
            elif [ "$result" == "success" ]; then
              echo "- Status: Passed" >> $GITHUB_STEP_SUMMARY
            else
              echo "- Status: Failed" >> $GITHUB_STEP_SUMMARY
              return 1
            fi
            return 0
          }

          echo "Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.setup.outputs.skip_build }}" == "true" ]; then
            echo "Build skipped (docs/config only changes)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          FAILED=false

          check_status "AOT Build Import Tests" \
            "${{ github.event.inputs.skip_aot }}" \
            "${{ needs.aot-build-import.result }}" || FAILED=true

          echo "" >> $GITHUB_STEP_SUMMARY
          check_status "GPU Tests (A10G)" \
            "${{ github.event.inputs.skip_gpu }}" \
            "${{ needs.gpu-tests-a10g.result }}" || FAILED=true

          echo "" >> $GITHUB_STEP_SUMMARY
          check_status "GPU Tests (T4)" \
            "${{ github.event.inputs.skip_gpu }}" \
            "${{ needs.gpu-tests-t4.result }}" || FAILED=true

          # H100 runs on a capacity block reservation, reported separately
          echo "" >> $GITHUB_STEP_SUMMARY
          H100="${{ needs.gpu-tests-h100.result }}"
          echo "GPU Tests (H100): $H100" >> $GITHUB_STEP_SUMMARY
          if [ "$H100" != "success" ] && [ "$H100" != "skipped" ] && [ "${{ github.event.inputs.skip_gpu }}" != "true" ]; then
            FAILED=true
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$FAILED" == "true" ]; then
            echo "Result: Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "Result: Tests Passed" >> $GITHUB_STEP_SUMMARY
