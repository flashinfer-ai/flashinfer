# CI workflow using AWS self-hosted runners.
# Runs AOT build tests and GPU unit tests on push/PR to main.
# Uses ci/bash.sh for Docker execution (same as Jenkins).
#
# Permission Control:
# - Push to main: Always runs
# - PRs: run only when the 'run-ci' label is applied, for every contributor.
#   Applying the label is the trigger, so new commits need a new trigger:
#   @flashinfer-bot run.
#
# Instance Purchasing:
# - All runners are on-demand. Spot was removed.
# - A failure here is a real failure, so there is nothing to retry
#   automatically.
# - On-demand capacity is billed for as long as it runs, so the first failure
#   should stop everything else. GitHub only fail-fasts within one matrix, so
#   all tests live in a single matrix built by the setup job. They still start
#   in parallel; the matrix exists purely to make the cancellation global.

name: PR Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, ready_for_review]
  workflow_dispatch:
    inputs:
      skip_aot:
        description: 'Skip AOT build tests'
        type: boolean
        default: false
      skip_gpu:
        description: 'Skip GPU tests'
        type: boolean
        default: false

concurrency:
  # A label other than run-ci can never start tests, so it gets its own group and
  # does not cancel - otherwise label churn would discard running GPU jobs.
  group: pr-test-${{ github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'run-ci') && '-noop' || '' }}
  cancel-in-progress: ${{ !(github.event.action == 'labeled' && github.event.label.name != 'run-ci') }}

permissions:
  contents: read
  pull-requests: write
  actions: read

env:
  EXECUTOR_NUMBER: "0"
  SKIP_CI_PATTERNS: '\.md$|\.txt$|^docs/|^docker/|^licenses/|^LICENSE$|^NOTICE$|^benchmarks/|^\.github/CODEOWNERS$'

jobs:
  # ---------------------------------------------------------------------------
  # Gate - Check if PR is authorized to run CI
  # ---------------------------------------------------------------------------
  gate:
    name: Permission Check
    runs-on: ubuntu-latest
    outputs:
      authorized: ${{ steps.check.outputs.authorized }}
    steps:
      - name: Check authorization
        id: check
        env:
          # Read via env, not inlined: a label name is caller-supplied text.
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          # Always allow push to main and workflow_dispatch
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "Not a PR, authorized"
            exit 0
          fi

          # Authorize on run-ci being applied, not on it being present: presence
          # would re-authorize every later push, which is the auto-trigger this
          # gate removes.
          if [[ "$EVENT_ACTION" == "labeled" && "$LABEL_NAME" == "run-ci" ]]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "run-ci label applied, authorized"
            exit 0
          fi

          echo "authorized=false" >> "$GITHUB_OUTPUT"
          echo "Not triggered by the run-ci label, skipping CI"

  # ---------------------------------------------------------------------------
  # Setup - Read docker tag and check if build should be skipped
  # ---------------------------------------------------------------------------
  setup:
    name: Setup
    needs: gate
    if: needs.gate.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.get-tag.outputs.tag }}
      skip_build: ${{ steps.check.outputs.skip }}
      test_matrix: ${{ steps.matrix.outputs.matrix }}
      test_count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate CUDA configuration
        run: python3 ci/validate_cuda_versions.py

      - name: Get Docker Tag
        id: get-tag
        run: |
          TAG=$(grep 'flashinfer/flashinfer-ci-cu129:' ci/docker-tags.yml | cut -d':' -f2 | tr -d ' ')
          if [ -z "$TAG" ]; then
            echo "::error::Failed to extract Docker tag from ci/docker-tags.yml"
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Docker tag: $TAG"

      - name: Load runtime CUDA matrix
        id: cuda-versions
        run: echo "runtime=$(jq -c '.runtime' ci/cuda-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Check Skip Conditions
        id: check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Use PR event SHAs for reliable diff (avoids issues with origin refs)
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          # TODO (yongwww): Add back ^\.github/ before merging to main
          SKIP_PATTERNS="$SKIP_CI_PATTERNS"

          SKIP=true
          while IFS= read -r file; do
            if [ -n "$file" ] && ! echo "$file" | grep -qE "$SKIP_PATTERNS"; then
              SKIP=false
              break
            fi
          done <<< "$CHANGED"

          echo "skip=$SKIP" >> $GITHUB_OUTPUT
          if [ "$SKIP" == "true" ]; then
            echo "::notice::Skipping build - only docs/config files changed"
          fi

      # Built here rather than written inline in the test job because the
      # skip_aot / skip_gpu dispatch inputs have to drop entries before the
      # matrix expands - a job-level `if` cannot see the matrix context, and
      # skipping inside the job would still claim a runner first.
      - name: Build Test Matrix
        id: matrix
        env:
          SKIP_AOT: ${{ github.event.inputs.skip_aot }}
          SKIP_GPU: ${{ github.event.inputs.skip_gpu }}
          RUNTIME_CUDA_MATRIX: ${{ steps.cuda-versions.outputs.runtime }}
        run: |
          {
            if [ "$SKIP_AOT" != "true" ]; then
              for arch in x64 arm64; do
                for cuda in $(jq -r '.[].label' <<< "${RUNTIME_CUDA_MATRIX}"); do
                  jq -nc --arg arch "$arch" --arg cuda "$cuda" '{
                    name: "AOT Build Import (\($arch), \($cuda))",
                    kind: "aot",
                    runner: ["self-hosted", "linux", $arch, "cpu", "on-demand"],
                    cuda: $cuda,
                    script: "task_test_jit_cache_package_build_import.sh",
                    timeout: 360
                  }'
                done
              done
            fi

            if [ "$SKIP_GPU" != "true" ]; then
              for shard in 1 2 3 4 5; do
                jq -nc --arg shard "$shard" '{
                  name: "JIT Unittest \($shard) (A10G)",
                  kind: "gpu",
                  runner: ["self-hosted", "linux", "x64", "gpu", "sm86", "on-demand"],
                  cuda: "cu129",
                  script: "task_jit_run_tests_part\($shard).sh",
                  timeout: 360
                }'
              done

              jq -nc '{
                name: "JIT Unittest (T4)",
                kind: "gpu",
                runner: ["self-hosted", "linux", "x64", "gpu", "sm75", "on-demand"],
                cuda: "cu129",
                script: "task_jit_run_tests_part3.sh",
                timeout: 360
              }'

              jq -nc '{
                name: "JIT Unittest (H100)",
                kind: "h100",
                runner: ["self-hosted", "linux", "x64", "gpu", "h100"],
                cuda: "cu129",
                script: "task_run_unit_tests.sh",
                timeout: 480
              }'
            fi
          } | jq -sc '{include: .}' > matrix.json

          echo "matrix=$(cat matrix.json)" >> $GITHUB_OUTPUT
          echo "count=$(jq '.include | length' matrix.json)" >> $GITHUB_OUTPUT
          jq -r '.include[].name' matrix.json

  # ---------------------------------------------------------------------------
  # Tests - AOT build imports and GPU unit tests
  #
  # Every test is one entry of a single matrix so that fail-fast cancels all of
  # them on the first failure. As separate jobs, fail-fast is scoped per group
  # and the other groups keep running on billed on-demand capacity long after
  # the result is known. Entries still start in parallel; nothing is serialized.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.name }}
    needs: [gate, setup]
    if: |
      needs.gate.outputs.authorized == 'true' &&
      needs.setup.outputs.skip_build != 'true' &&
      needs.setup.outputs.test_count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.setup.outputs.test_matrix) }}
    env:
      DOCKER_IMAGE: flashinfer/flashinfer-ci-${{ matrix.cuda }}:${{ needs.setup.outputs.docker_tag }}
      MATRIX_ARCH: ${{ matrix.runner[2] }}
      MATRIX_CUDA: ${{ matrix.cuda }}
      TEST_SCRIPT: ${{ matrix.script }}
    steps:
      - name: Cleanup
        if: matrix.kind != 'h100'
        run: |
          # Stop all Docker containers to free memory
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          # Clean workspace and caches
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true
          nvidia-smi || true

      - name: Cleanup
        if: matrix.kind == 'h100'
        run: |
          # Shared multi-runner node: only stop containers started by THIS runner (identified by workspace mount)
          for cid in $(docker ps -q); do
            if docker inspect "$cid" --format '{{json .Mounts}}' 2>/dev/null | grep -qF "${{ github.workspace }}/"; then
              docker stop "$cid" 2>/dev/null || true
            fi
          done
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          rm -rf ~/.cache/flashinfer_jit || true
          docker container prune -f 2>/dev/null || true
          docker image prune -f || true
          docker builder prune -f --filter "until=24h" || true
          echo "CUDA_VISIBLE_DEVICES=$CUDA_VISIBLE_DEVICES"
          nvidia-smi -i "$CUDA_VISIBLE_DEVICES" || true

      - uses: actions/checkout@v5
        with:
          submodules: recursive
          # Self-hosted runners keep the workspace between jobs, so the token
          # must not be left behind in .git/config. Nothing here uses git after
          # checkout, and submodules authenticate during the checkout itself.
          persist-credentials: false

      - name: Show Node Info
        run: ./scripts/task_show_node_info.sh
        env:
          NODE_NAME: ${{ runner.name }}
          WORKSPACE: ${{ github.workspace }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Run Test
        if: matrix.kind == 'aot'
        env:
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ "${TEST_SCRIPT}" != "task_test_jit_cache_package_build_import.sh" ]; then
            echo "::error::Unexpected AOT test script: ${TEST_SCRIPT}"
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/sccache-stats"
          bash ci/bash.sh "${DOCKER_IMAGE}" \
            -e SCCACHE_BUCKET "${SCCACHE_BUCKET}" \
            -e SCCACHE_REGION "${SCCACHE_REGION}" \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e SCCACHE_STATS_DIR /workspace/sccache-stats \
            --no-gpu "./scripts/${TEST_SCRIPT}"

      - name: Display sccache stats
        if: always() && matrix.kind == 'aot'
        run: |
          STATS_FILE="${GITHUB_WORKSPACE}/sccache-stats/sccache-stats.txt"
          if [ -s "${STATS_FILE}" ]; then
            cat "${STATS_FILE}"
          else
            echo "::warning::sccache stats were not produced"
          fi

      - name: Record sccache job metadata
        if: always() && matrix.kind == 'aot'
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/sccache-stats"
          IMAGE_DIGESTS=$(docker image inspect --format '{{json .RepoDigests}}' "${DOCKER_IMAGE}" 2>/dev/null || printf 'unavailable')
          {
            printf 'git_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'docker_image=%s\n' "${DOCKER_IMAGE}"
            printf 'docker_image_repo_digests=%s\n' "${IMAGE_DIGESTS}"
            printf 'matrix_cuda=%s\n' "${MATRIX_CUDA}"
            printf 'matrix_arch=%s\n' "${MATRIX_ARCH}"
          } > "${GITHUB_WORKSPACE}/sccache-stats/job-metadata.txt"

      - name: Upload sccache stats
        if: always() && matrix.kind == 'aot'
        uses: actions/upload-artifact@v4
        with:
          name: sccache-stats-${{ matrix.cuda }}-${{ matrix.runner[2] }}
          path: sccache-stats/
          if-no-files-found: warn
          retention-days: 14

      - name: Run Test
        if: matrix.kind != 'aot'
        run: |
          case "${TEST_SCRIPT}" in
            task_jit_run_tests_part[1-5].sh|task_run_unit_tests.sh) ;;
            *)
              echo "::error::Unexpected GPU test script: ${TEST_SCRIPT}"
              exit 1
              ;;
          esac
          bash ci/bash.sh "${DOCKER_IMAGE}" "./scripts/${TEST_SCRIPT}"

      - name: Make JUnit XML readable
        if: ${{ always() && matrix.kind == 'h100' }}
        run: |
          if [ -d junit ]; then
            sudo chmod -R a+rX junit
          fi

      - name: Upload JUnit XML
        if: ${{ always() && matrix.kind == 'h100' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-h100-${{ github.run_id }}-${{ github.run_attempt }}
          path: junit/**/*.xml
          if-no-files-found: warn
          retention-days: 30


  # ---------------------------------------------------------------------------
  # Test Results Summary
  # ---------------------------------------------------------------------------
  test-results-summary:
    name: Test Results Summary
    if: "!cancelled()"
    needs:
      - gate
      - setup
      - test
    runs-on: ubuntu-latest
    steps:
      - name: Check Authorization
        if: needs.gate.outputs.authorized != 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check skip patterns for unauthorized PRs
        if: needs.gate.outputs.authorized != 'true'
        id: skip-check
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          SKIP_PATTERNS="$SKIP_CI_PATTERNS"

          SKIP=true
          while IFS= read -r file; do
            if [ -n "$file" ] && ! echo "$file" | grep -qE "$SKIP_PATTERNS"; then
              SKIP=false
              break
            fi
          done <<< "$CHANGED"

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Report unauthorized PR status
        if: needs.gate.outputs.authorized != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.skip-check.outputs.skip }}" == "true" ]; then
            echo "CI not required (docs/config only changes)" >> $GITHUB_STEP_SUMMARY
            echo "::notice::Docs-only PR — no CI needed"
            exit 0
          fi

          # Don't turn an already-passing commit red for an event that changed no
          # code - re-earning that green costs another full GPU run. A code change
          # produces a new SHA with no prior run, so this cannot report untested
          # code as passing.
          PASSED=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --commit "$HEAD_SHA" \
            --status success \
            --json databaseId --jq 'length' 2>/dev/null) || PASSED=0

          if [ "${PASSED:-0}" -gt 0 ]; then
            echo "CI already passed for this commit ($HEAD_SHA)" >> $GITHUB_STEP_SUMMARY
            echo "::notice::Keeping the passing result already recorded for this commit"
            exit 0
          fi

          # Failing while another run tests this commit would turn the required
          # check red under it, so report what that run reports. Older runs only,
          # so two label events cannot wait on each other.
          ACTIVE=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --commit "$HEAD_SHA" \
            --limit 50 \
            --json databaseId,status \
            --jq '[.[] | select(.databaseId < (env.GITHUB_RUN_ID | tonumber))
                       | select(.status == "in_progress" or .status == "queued")]
                  | min_by(.databaseId) | .databaseId // empty' 2>/dev/null) || ACTIVE=""

          if [ -n "$ACTIVE" ]; then
            RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/$ACTIVE"
            echo "Tests for this commit are running in [run $ACTIVE]($RUN_URL)" >> $GITHUB_STEP_SUMMARY

            # The summary lands only when this job ends, so the annotation is
            # what carries the link on the PR meanwhile.
            echo "::notice title=Tests are already running for this commit::$RUN_URL"

            # No wait limit, because any number here would guess at test duration
            # and guessing low fails a healthy run. The wait ends when the
            # followed run concludes, or when it stops being readable.
            CONCLUSION=""
            UNREADABLE=0
            while true; do
              INFO=$(gh run view "$ACTIVE" --repo "${{ github.repository }}" \
                --json status,conclusion,jobs \
                --jq '.status + "|" + (.conclusion // "") + "|"
                      + ([.jobs[] | select(.status == "completed")] | length | tostring) + " done, "
                      + ([.jobs[] | select(.status == "in_progress")] | length | tostring) + " running, "
                      + ([.jobs[] | select(.status == "queued")] | length | tostring) + " waiting for a runner, of "
                      + (.jobs | length | tostring) + " jobs"' 2>/dev/null) || INFO=""
              IFS='|' read -r STATUS CONCLUSION PROGRESS <<< "$INFO"

              if [ "$STATUS" == "completed" ]; then
                break
              fi

              # Transient errors retry; 5 minutes unreadable means the run is
              # gone and no conclusion is coming.
              if [ -z "$STATUS" ]; then
                UNREADABLE=$((UNREADABLE + 1))
                if [ "$UNREADABLE" -ge 10 ]; then
                  echo "Result: run $ACTIVE is no longer readable" >> $GITHUB_STEP_SUMMARY
                  exit 1
                fi
              else
                UNREADABLE=0
              fi

              echo "run $ACTIVE after $((SECONDS / 60))m: ${PROGRESS:-progress unavailable} - $RUN_URL"
              sleep 30
            done

            if [ "$CONCLUSION" == "success" ] || [ "$CONCLUSION" == "skipped" ]; then
              echo "Result: Tests Passed" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "Result: run $ACTIVE ended as '${CONCLUSION:-still running}'" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "CI skipped (pending authorization)" >> $GITHUB_STEP_SUMMARY
          echo "A contributor who can label the PR, or a \`ci-users\` member, can comment \`@flashinfer-bot run\` to start CI." >> $GITHUB_STEP_SUMMARY
          echo "This is also needed after pushing new commits, since CI no longer starts on its own." >> $GITHUB_STEP_SUMMARY
          echo "::warning::CI skipped — pending authorization"
          exit 1

      - name: Check Results
        if: needs.gate.outputs.authorized == 'true'
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # A failed setup leaves the tests skipped and skip_build empty, which
          # would otherwise reach the "skipped counts as passed" branch below
          # and report success for a run where nothing was tested.
          SETUP="${{ needs.setup.result }}"
          if [ "$SETUP" != "success" ]; then
            echo "Setup did not succeed (result: $SETUP), so no tests ran" >> $GITHUB_STEP_SUMMARY
            echo "Result: Tests Failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          if [ "${{ needs.setup.outputs.skip_build }}" == "true" ]; then
            echo "Build skipped (docs/config only changes)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Every test is one entry of a single matrix, so this is the aggregate
          # result. Per-test outcomes are on the individual checks.
          RESULT="${{ needs.test.result }}"
          echo "Tests: ${{ needs.setup.outputs.test_count }}, result: $RESULT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$RESULT" == "success" ] || [ "$RESULT" == "skipped" ]; then
            echo "Result: Tests Passed" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # fail-fast stops the siblings as soon as one entry fails, so any
          # cancelled test means "stopped early", not "flaky".
          echo "Result: Tests Failed" >> $GITHUB_STEP_SUMMARY
          exit 1
