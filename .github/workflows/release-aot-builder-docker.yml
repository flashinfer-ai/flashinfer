name: Release AOT Builder Docker

# Builds the pre-baked manylinux builder images used by the nightly/release
# flashinfer-jit-cache provider and shim jobs (docker/Dockerfile.aot-builder)
# and records the published tag in ci/aot-builder-tags.yml. Jobs fall back to the
# stock PyTorch manylinux builder until that file lists a tag.
#
# The weekly schedule is the refresh policy for the cu134 PyTorch nightly: the
# image pins whatever torch the nightly index serves at build time, and the tag
# update PR makes each torch change an explicit, reviewable commit.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'
  push:
    branches:
      - main
    paths:
      - '.python-version'
      - 'ci/cuda-versions.json'
      - 'docker/Dockerfile.aot-builder'
      - 'docker/aot-builder-requirements.txt'
      - 'docker/install/install_aot_builder_packages.sh'
      - 'docker/test_aot_builder_image.py'
      - 'scripts/jit_cache_build_common.sh'
      - '.github/workflows/release-aot-builder-docker.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.python-version'
      - 'ci/cuda-versions.json'
      - 'docker/Dockerfile.aot-builder'
      - 'docker/aot-builder-requirements.txt'
      - 'docker/install/install_aot_builder_packages.sh'
      - 'docker/test_aot_builder_image.py'
      - 'scripts/jit_cache_build_common.sh'
      - '.github/workflows/release-aot-builder-docker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    outputs:
      date_sha: ${{ steps.generate_tag.outputs.date_sha }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate CUDA configuration
        run: python3 ci/validate_cuda_versions.py

      - name: Generate version tag
        id: generate_tag
        run: |
          DATE_SHA=$(date +'%Y%m%d')-$(git rev-parse --short HEAD)
          echo "date_sha=${DATE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build image matrix
        id: matrix
        # One entry per jit_cache CUDA version; the cuDNN version comes from the
        # runtime entry with the same label.
        run: |
          matrix=$(jq -c '. as $c | [.jit_cache[] | . as $j | {
              label: $j.label,
              version: $j.version,
              pytorch_index: $j.pytorch_index,
              cudnn_version: ($c.runtime[] | select(.label == $j.label) | .cudnn_version)
            }]' ci/cuda-versions.json)
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test AOT builder (${{ matrix.cuda.label }}, ${{ matrix.arch }})
    runs-on: [self-hosted, linux, "${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}", cpu, on-demand]
    needs: generate-tag
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        cuda: ${{ fromJSON(needs.generate-tag.outputs.matrix) }}
        arch: [amd64, arm64]
    env:
      IMAGE_TAG: flashinfer/flashinfer-aot-builder-${{ matrix.cuda.label }}:${{ matrix.arch }}-${{ needs.generate-tag.outputs.date_sha }}
      BASE_IMAGE: ${{ matrix.arch == 'arm64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda.version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda.version) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: flashinfer
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and load image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.aot-builder
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            PYTORCH_INDEX=${{ matrix.cuda.pytorch_index }}
            CUDNN_VERSION=${{ matrix.cuda.cudnn_version }}
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          no-cache: true
          tags: ${{ env.IMAGE_TAG }}
          provenance: false
          sbom: false

      - name: Test candidate image before publishing
        env:
          CUDA_VERSION: ${{ matrix.cuda.version }}
          PYTORCH_INDEX: ${{ matrix.cuda.pytorch_index }}
          CUDNN_VERSION: ${{ matrix.cuda.cudnn_version }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          PYTHON_ABI="cp$(tr -d '[:space:].' < .python-version)"
          docker run --rm --pull=never --platform "linux/${TARGET_ARCH}" -i \
            "${IMAGE_TAG}" \
            "/opt/python/${PYTHON_ABI}-${PYTHON_ABI}/bin/python" - \
            "${CUDA_VERSION}" "${PYTORCH_INDEX}" "${CUDNN_VERSION}" \
            < docker/test_aot_builder_image.py

      - name: Push tested image
        if: github.event_name != 'pull_request'
        run: docker push "${IMAGE_TAG}"

      - name: Remove candidate image
        if: always()
        run: docker image rm "${IMAGE_TAG}" || true

  update-aot-builder-tags:
    # Only publish tags when every image in the matrix was built and pushed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [generate-tag, build]
    steps:
      - uses: actions/checkout@v4

      - name: Update aot-builder-tags.yml
        env:
          DATE_SHA: ${{ needs.generate-tag.outputs.date_sha }}
        run: |
          jq -r --arg tag "${DATE_SHA}" \
            '.jit_cache[] | "flashinfer/flashinfer-aot-builder-\(.label): \($tag)"' \
            ci/cuda-versions.json > ci/aot-builder-tags.yml

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.FLASHINFER_BOT_TOKEN }}
          commit-message: "Update AOT builder tags to ${{ needs.generate-tag.outputs.date_sha }}"
          title: "Update AOT builder image tags to ${{ needs.generate-tag.outputs.date_sha }}"
          body: |
            Points the nightly/release jit-cache provider builds at the AOT builder images tagged `${{ needs.generate-tag.outputs.date_sha }}`.

            Merging changes the pinned torch / apache-tvm-ffi inputs of every sccache key for the affected CUDA versions; expect one cold-ish nightly after a torch bump.

            Auto-generated by [release-aot-builder-docker workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          branch: update-aot-builder-tags
          delete-branch: true
          labels: |
            docker
            automated
