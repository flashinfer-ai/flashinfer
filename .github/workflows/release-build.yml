name: Release Build

# Shared build pipeline of release.yml and nightly-release.yml: the
# flashinfer-python sdist/wheel, the flashinfer-cubin wheel, the JIT-cache
# provider and shim wheels, and the provider-set validation. It uploads
# artifacts to the calling run (flashinfer-python-dist, flashinfer-cubin-wheel,
# jit-cache-provider-*, jit-cache-shim-*) and publishes nothing; publishing,
# versioning, triggers and concurrency stay in the callers.

on:
  workflow_call:
    inputs:
      ref:
        description: 'Ref to check out (empty: the calling workflow commit)'
        type: string
        default: ''
      repository:
        description: 'Repository to check out (empty: the calling repository)'
        type: string
        default: ''
      dev_suffix:
        description: 'YYYYMMDD dev suffix for nightly versions (empty: release version)'
        type: string
        default: ''
      wheel_version:
        description: 'Version the provider and shim wheels must carry, without the +cuda local part'
        type: string
        required: true
      clean_self_hosted_runners:
        description: 'Stop containers and wipe the workspace on self-hosted runners before each build'
        type: boolean
        default: false
      exclude_experimental_sources:
        description: 'Leave the experimental packages generated kernel sources out of the flashinfer-python wheel (release only; keeps it under the PyPI 100 MB file limit, flashinfer-ai/flashinfer#7977)'
        type: boolean
        default: false
      cubin_retry_window_seconds:
        description: 'FLASHINFER_CUBIN_RETRY_WINDOW_SECONDS for the cubin download'
        type: string
        default: '0'
    secrets:
      SCCACHE_AWS_ACCESS_KEY_ID:
        required: false
      SCCACHE_AWS_SECRET_ACCESS_KEY:
        required: false
    outputs:
      runtime_cuda_matrix:
        description: 'Runtime CUDA matrix from ci/cuda-versions.json'
        value: ${{ jobs.setup.outputs.runtime_cuda_matrix }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      jit_cache_provider_matrix: ${{ steps.cuda-versions.outputs.providers }}
      jit_cache_shim_matrix: ${{ steps.cuda-versions.outputs.shims }}
      runtime_cuda_matrix: ${{ steps.cuda-versions.outputs.runtime }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Validate CUDA configuration
        run: python3 ci/validate_cuda_versions.py

      - name: Load CUDA wheel matrix
        id: cuda-versions
        run: |
          echo "providers=$(python3 ci/validate_cuda_versions.py --matrix providers)" >> "$GITHUB_OUTPUT"
          echo "shims=$(python3 ci/validate_cuda_versions.py --matrix shims)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -c '.runtime' ci/cuda-versions.json)" >> "$GITHUB_OUTPUT"

  build-flashinfer-python:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build flashinfer-python wheel and sdist
        env:
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ inputs.dev_suffix }}
          FLASHINFER_WHEEL_EXCLUDE_EXPERIMENTAL_SOURCES: ${{ inputs.exclude_experimental_sources && '1' || '' }}
        run: |
          echo "Building flashinfer-python (dev suffix: '${FLASHINFER_DEV_RELEASE_SUFFIX}')..."
          echo "Git commit: $(git rev-parse HEAD)"
          python -m build
          ls -lh dist/

      - name: Upload flashinfer-python artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist/*
          retention-days: 7

  build-flashinfer-cubin:
    needs: setup
    # Pinned to 24.04: the 26.04 image mounts /tmp as a quota-limited tmpfs.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Restore cubin download cache
        id: cubin-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: flashinfer-cubin/flashinfer_cubin/cubins
          # Older artifact sets are safe fallback seeds: the downloader verifies
          # every file and prunes stale entries before packaging.
          key: flashinfer-cubins-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flashinfer/artifacts.py') }}
          restore-keys: |
            flashinfer-cubins-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flashinfer/artifacts.py') }}-partial-
            flashinfer-cubins-v1-${{ runner.os }}-${{ runner.arch }}-

      # The cubin backend imports flashinfer.artifacts, whose import chain
      # (jit.core, compilation_context, cpp_ext) needs torch only for its CPU
      # side; no CUDA is used. An isolated PEP 517 environment would install the
      # default CUDA torch wheel and its nvidia-* dependencies (several GB),
      # which filled the ~8 GB free on the hosted runner's root disk. Install
      # the CPU wheel into the job environment and build with --no-isolation.
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel tomli
          # Everything in flashinfer-cubin's [build-system].requires except
          # torch, so the list cannot drift from pyproject.toml.
          python - <<'PY' > "${RUNNER_TEMP}/cubin-build-requires.txt"
          import tomli
          with open("flashinfer-cubin/pyproject.toml", "rb") as f:
              requires = tomli.load(f)["build-system"]["requires"]
          print("\n".join(r for r in requires if not r.startswith("torch")))
          PY
          pip install -r "${RUNNER_TEMP}/cubin-build-requires.txt"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Build flashinfer-cubin wheel
        id: build-cubin-wheel
        env:
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ inputs.dev_suffix }}
          FLASHINFER_CUBIN_RETRY_WINDOW_SECONDS: ${{ inputs.cubin_retry_window_seconds }}
        run: |
          df -h /
          echo "Building flashinfer-cubin (dev suffix: '${FLASHINFER_DEV_RELEASE_SUFFIX}')..."
          echo "Git commit: $(git rev-parse HEAD)"
          cd flashinfer-cubin
          rm -rf dist build *.egg-info
          # The backend also lists provider-build requirements (CUTLASS DSL)
          # that the cubin build never imports; skip the pre-check for them.
          python -m build --no-isolation --skip-dependency-check --wheel
          ls -lh dist/
          mkdir -p ../dist
          cp dist/*.whl ../dist/

      - name: Remove cubin cache lock files
        if: always()
        run: find flashinfer-cubin/flashinfer_cubin/cubins -type f -name '*.lock' -delete

      - name: Save partial cubin download cache
        if: failure() && steps.build-cubin-wheel.outcome == 'failure' && steps.cubin-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: flashinfer-cubin/flashinfer_cubin/cubins
          key: flashinfer-cubins-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flashinfer/artifacts.py') }}-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save complete cubin download cache
        if: steps.build-cubin-wheel.outcome == 'success' && steps.cubin-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: flashinfer-cubin/flashinfer_cubin/cubins
          key: flashinfer-cubins-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flashinfer/artifacts.py') }}

      - name: Upload flashinfer-cubin artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist/*.whl
          retention-days: 7

  build-flashinfer-jit-cache-provider:
    name: JIT cache provider (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }}, ${{ matrix.provider_tag }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_provider_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Cleanup
        if: inputs.clean_self_hosted_runners
        run: |
          docker ps -q | xargs -r docker stop || true
          docker ps -aq | xargs -r docker rm || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}
          submodules: true

      - name: Build and validate provider wheel
        env:
          ARCH: ${{ matrix.cpu_architecture }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          DOCKER_IMAGE: ${{ matrix.cpu_architecture == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda_version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda_version) }}
          FLASHINFER_CI_CACHE: ${{ github.workspace }}/ci-cache
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ inputs.dev_suffix }}
          FLASHINFER_JIT_CACHE_BUILD_TARGET: provider
          FLASHINFER_JIT_CACHE_PROVIDER_ARCH: ${{ matrix.provider_architecture }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda_label }}
          PYTORCH_INDEX: ${{ matrix.pytorch_index }}
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET || 'flashinfer-build-cache' }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION || 'us-west-2' }}
        run: bash scripts/build_flashinfer_jit_cache_artifact.sh
        timeout-minutes: 360

      - name: Upload provider build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-diagnostics-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}-${{ matrix.provider_tag }}
          path: sccache-stats/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload provider artifact
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-provider-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}-${{ matrix.provider_tag }}
          path: flashinfer-jit-cache-provider/dist/*
          retention-days: 7

  build-flashinfer-jit-cache-shim:
    name: JIT cache shim (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_shim_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Cleanup
        if: inputs.clean_self_hosted_runners
        run: |
          docker ps -q | xargs -r docker stop || true
          docker ps -aq | xargs -r docker rm || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      # The shim is a metadata-only wheel: it needs no torch, CUDA toolkit or
      # builder image, so it builds on the runner's own Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Build shim wheel
        env:
          ARCH: ${{ matrix.cpu_architecture }}
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ inputs.dev_suffix }}
          FLASHINFER_JIT_CACHE_PROVIDER_ARCHS: ${{ matrix.provider_architectures }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda_label }}
        run: bash scripts/build_jit_cache_shim_wheel.sh
        timeout-minutes: 15

      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-shim-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}
          path: flashinfer-jit-cache/dist/*.whl
          retention-days: 7

  validate-flashinfer-jit-cache-providers:
    name: Validate provider set (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }})
    needs: [setup, build-flashinfer-jit-cache-provider, build-flashinfer-jit-cache-shim]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_shim_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Download provider artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jit-cache-provider-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Download shim artifact
        uses: actions/download-artifact@v4
        with:
          name: jit-cache-shim-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}
          path: wheelhouse

      - name: Verify default and minimal installation
        env:
          EXPECTED_PROVIDERS: ${{ matrix.provider_tags }}
          EXPECTED_VERSION: ${{ inputs.wheel_version }}+${{ matrix.cuda_label }}
          PLATFORM_TAG: manylinux_2_28_${{ matrix.cpu_architecture }}
        run: |
          read -ra PROVIDERS <<< "${EXPECTED_PROVIDERS}"
          python3 scripts/verify_jit_cache_provider_release.py \
            --wheelhouse wheelhouse \
            --version "${EXPECTED_VERSION}" \
            --providers "${PROVIDERS[@]}" \
            --provider-platform-tag "${PLATFORM_TAG}" \
            --install-smoke
