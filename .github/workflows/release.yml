name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.2.3) to build and publish'
        required: true
        type: string
  pull_request:
    paths:
      - '.python-version'
      - '.github/workflows/release.yml'
      - 'build_utils.py'
      - 'ci/cuda-versions.json'
      - 'ci/validate_cuda_versions.py'
      - 'flashinfer-jit-cache-provider/**'
      - 'flashinfer-jit-cache/**'
      - 'scripts/build_flashinfer_jit_cache_artifact.sh'
      - 'scripts/build_flashinfer_jit_cache_whl.sh'
      - 'scripts/build_patched_sccache.sh'
      - 'scripts/jit_cache_build_common.sh'
      - 'scripts/update_whl_index.py'
      - 'scripts/verify_jit_cache_provider_release.py'
      - 'scripts/jit_cache_provider_validation.py'
      - 'scripts/verify_jit_cache_provider_artifact.py'

concurrency:
  # Superseded PR dry-runs only waste runner time; real release dispatches use
  # unique groups so they remain independent and are never auto-cancelled.
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      release_tag: ${{ steps.set-version.outputs.release_tag }}
      is_pr: ${{ steps.set-version.outputs.is_pr }}
      jit_cache_provider_matrix: ${{ steps.cuda-versions.outputs.providers }}
      jit_cache_shim_matrix: ${{ steps.cuda-versions.outputs.shims }}
      python_version: ${{ steps.set-version.outputs.python_version }}
    steps:
      - name: Determine if running in PR mode
        id: check-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" == "pull_request" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "Running in PR mode (dry-run)"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "Running in release mode"
          fi

      - name: Validate tag format
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?$ ]]; then
            echo "Error: Tag '${RELEASE_INPUT_TAG}' does not match the expected format (e.g., v1.2.3 or v1.2.3.post1 or v1.2.3rc1)"
            exit 1
          fi
          echo "✓ Tag format is valid: ${RELEASE_INPUT_TAG}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A fork's head branch does not exist in the base repository, so use
          # its repository and immutable SHA for pull-request dry runs.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Validate CUDA configuration
        run: python3 ci/validate_cuda_versions.py

      - name: Verify tag matches version.txt
        id: set-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Check version.txt - this is the source of truth
          if [ ! -f "version.txt" ]; then
            echo "Error: version.txt file not found!"
            exit 1
          fi

          VERSION_TXT=$(cat version.txt | tr -d '[:space:]')
          PYTHON_VERSION=$(tr -d '[:space:]' < .python-version)
          if [[ ! "${VERSION_TXT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?$ ]]; then
            echo "Error: version.txt contains an invalid version: ${VERSION_TXT}"
            exit 1
          fi

          # In PR mode, use version from version.txt with a test suffix
          if [ "${EVENT_NAME}" == "pull_request" ]; then
            IS_PR=true
            RELEASE_TAG="test-v${VERSION_TXT}-pr${PR_NUMBER}"
            echo "✓ PR mode: using test tag ${RELEASE_TAG}"
          else
            # Extract version from tag (remove 'v' prefix)
            TAG_VERSION="${RELEASE_INPUT_TAG}"
            TAG_VERSION="${TAG_VERSION#v}"

            if [ "$TAG_VERSION" != "$VERSION_TXT" ]; then
              echo "❌ CRITICAL ERROR: version.txt does not match tag!"
              echo "  Tag version: $TAG_VERSION"
              echo "  version.txt: $VERSION_TXT"
              echo ""
              echo "Please update version.txt to match the release version before creating a release."
              echo "The tag should be 'v$VERSION_TXT' (e.g., if version.txt contains '1.2.3', tag should be 'v1.2.3')"
              exit 1
            fi

            IS_PR=false
            RELEASE_TAG="${RELEASE_INPUT_TAG}"
            echo "✓ version.txt matches tag version: $VERSION_TXT"
          fi

          {
            echo "python_version=${PYTHON_VERSION}"
            echo "is_pr=${IS_PR}"
            echo "version=${VERSION_TXT}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Load CUDA wheel matrix
        id: cuda-versions
        run: |
          echo "providers=$(python3 ci/validate_cuda_versions.py --matrix providers)" >> "$GITHUB_OUTPUT"
          echo "shims=$(python3 ci/validate_cuda_versions.py --matrix shims)" >> "$GITHUB_OUTPUT"

  build-flashinfer-python:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build flashinfer-python wheel and sdist
        run: |
          echo "Building flashinfer-python..."
          echo "Git commit: $(git rev-parse HEAD)"
          python -m build
          ls -lh dist/

      - name: Upload flashinfer-python artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist/*
          retention-days: 7

  build-flashinfer-cubin:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build flashinfer-cubin wheel
        run: |
          echo "Building flashinfer-cubin..."
          echo "Git commit: $(git rev-parse HEAD)"
          cd flashinfer-cubin
          rm -rf dist build *.egg-info
          python -m build --wheel
          ls -lh dist/
          mkdir -p ../dist
          cp dist/*.whl ../dist/

      - name: Upload flashinfer-cubin artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist/*.whl
          retention-days: 7

  build-flashinfer-jit-cache-provider-sccache:
    name: Provider sccache (cu134, ${{ matrix.cpu_architecture }})
    needs: setup
    strategy:
      matrix:
        cpu_architecture: [x86_64, aarch64]
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Build patched sccache
        env:
          CUDA_VERSION: '13.4'
          DOCKER_IMAGE: ${{ matrix.cpu_architecture == 'aarch64' && 'pytorch/manylinuxaarch64-builder:cuda13.4' || 'pytorch/manylinux2_28-builder:cuda13.4' }}
          SCCACHE_PATCHED_BINARY_PATH: /ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}/sccache
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-cache"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${GITHUB_WORKSPACE}/ci-cache:/ci-cache" \
            -e CUDA_VERSION \
            -e SCCACHE_PATCHED_BINARY_PATH \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash /workspace/scripts/build_patched_sccache.sh

      - name: Upload patched sccache
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-sccache-cu134-${{ matrix.cpu_architecture }}
          path: ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}/sccache
          retention-days: 7

  build-flashinfer-jit-cache-provider:
    name: JIT cache provider (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }}, ${{ matrix.provider_tag }})
    needs: [setup, build-flashinfer-jit-cache-provider-sccache]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_provider_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Download patched sccache
        if: matrix.cuda_label == 'cu134'
        uses: actions/download-artifact@v4
        with:
          name: jit-cache-sccache-cu134-${{ matrix.cpu_architecture }}
          path: ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}

      - name: Make patched sccache executable
        if: matrix.cuda_label == 'cu134'
        run: chmod +x ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}/sccache

      - name: Build and validate provider wheel
        env:
          ARCH: ${{ matrix.cpu_architecture }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          DOCKER_IMAGE: ${{ matrix.cpu_architecture == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda_version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda_version) }}
          FLASHINFER_CI_CACHE: ${{ github.workspace }}/ci-cache
          FLASHINFER_JIT_CACHE_BUILD_TARGET: provider
          FLASHINFER_JIT_CACHE_PROVIDER_ARCH: ${{ matrix.provider_architecture }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda_label }}
          PYTORCH_INDEX: ${{ matrix.pytorch_index }}
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET || 'flashinfer-build-cache' }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION || 'us-west-2' }}
        run: bash scripts/build_flashinfer_jit_cache_artifact.sh
        timeout-minutes: 360

      - name: Upload provider artifact
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-provider-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}-${{ matrix.provider_tag }}
          path: flashinfer-jit-cache-provider/dist/*
          retention-days: 7

  build-flashinfer-jit-cache-shim:
    name: JIT cache shim (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_shim_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Build shim wheel
        env:
          ARCH: ${{ matrix.cpu_architecture }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          DOCKER_IMAGE: ${{ matrix.cpu_architecture == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda_version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda_version) }}
          FLASHINFER_CI_CACHE: ${{ github.workspace }}/ci-cache
          FLASHINFER_JIT_CACHE_BUILD_TARGET: shim
          FLASHINFER_JIT_CACHE_PROVIDER_ARCHS: ${{ matrix.provider_architectures }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda_label }}
          PYTORCH_INDEX: ${{ matrix.pytorch_index }}
        run: bash scripts/build_flashinfer_jit_cache_artifact.sh
        timeout-minutes: 60

      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-shim-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}
          path: flashinfer-jit-cache/dist/*.whl
          retention-days: 7

  validate-flashinfer-jit-cache-providers:
    name: Validate provider set (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }})
    needs: [setup, build-flashinfer-jit-cache-provider, build-flashinfer-jit-cache-shim]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_shim_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Download provider artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jit-cache-provider-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Download shim artifact
        uses: actions/download-artifact@v4
        with:
          name: jit-cache-shim-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}
          path: wheelhouse

      - name: Verify default and minimal installation
        env:
          EXPECTED_PROVIDERS: ${{ matrix.provider_tags }}
          EXPECTED_VERSION: ${{ needs.setup.outputs.version }}+${{ matrix.cuda_label }}
          PLATFORM_TAG: manylinux_2_28_${{ matrix.cpu_architecture }}
        run: |
          read -ra PROVIDERS <<< "${EXPECTED_PROVIDERS}"
          python3 scripts/verify_jit_cache_provider_release.py \
            --wheelhouse wheelhouse \
            --version "${EXPECTED_VERSION}" \
            --providers "${PROVIDERS[@]}" \
            --provider-platform-tag "${PLATFORM_TAG}" \
            --install-smoke

  create-release:
    needs: [setup, build-flashinfer-python, build-flashinfer-cubin, build-flashinfer-jit-cache-provider, build-flashinfer-jit-cache-shim, validate-flashinfer-jit-cache-providers]
    if: >-
      always() && github.event_name == 'workflow_dispatch' &&
      needs.setup.result == 'success' &&
      needs.build-flashinfer-python.result == 'success' &&
      needs.build-flashinfer-cubin.result == 'success' &&
      needs.build-flashinfer-jit-cache-provider.result == 'success' &&
      needs.build-flashinfer-jit-cache-shim.result == 'success' &&
      needs.validate-flashinfer-jit-cache-providers.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Generate release notes
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # Get the previous release tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${RELEASE_TAG}$" | tail -n1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating notes from all commits"
            NOTES=$(gh api "/repos/${REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="${TARGET_SHA}" \
              --jq '.body')
          else
            echo "Generating notes from ${PREV_TAG} to ${RELEASE_TAG}"
            NOTES=$(gh api "/repos/${REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" \
              -f previous_tag_name="$PREV_TAG" \
              -f target_commitish="${TARGET_SHA}" \
              --jq '.body')
          fi

          # Save to file for multi-line output
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (empty first)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release-notes.outputs.notes_file }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # Delete existing release and tag if they exist
          if gh release view "${RELEASE_TAG}" &>/dev/null; then
            echo "Deleting existing release: ${RELEASE_TAG}"
            gh release delete "${RELEASE_TAG}" --yes
          fi

          # Read release notes from file
          NOTES=$(cat "${NOTES_FILE}")

          # Create new release without assets first
          gh release create "${RELEASE_TAG}" \
            --title "Release v${RELEASE_VERSION}" \
            --notes "$NOTES"

      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Upload flashinfer-python to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-python/* --clobber

      - name: Download flashinfer-cubin artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist-cubin/

      - name: Upload flashinfer-cubin to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-cubin/* --clobber

      - name: Upload provider and shim wheels to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          mapfile -t CUDA_LABELS < <(jq -r '.jit_cache[].label' ci/cuda-versions.json)
          for cuda_label in "${CUDA_LABELS[@]}"; do
            for arch in x86_64 aarch64; do
              rm -rf dist-jit-cache
              mkdir -p dist-jit-cache
              gh run download "${GITHUB_RUN_ID}" \
                --pattern "jit-cache-provider-${cuda_label}-${arch}-*" \
                --dir dist-jit-cache
              gh run download "${GITHUB_RUN_ID}" \
                --name "jit-cache-shim-${cuda_label}-${arch}" \
                --dir dist-jit-cache

              while IFS= read -r wheel; do
                gh release upload "${RELEASE_TAG}" "${wheel}" --clobber
              done < <(find dist-jit-cache -type f -name '*.whl' -print)
            done
          done

  publish-to-pypi:
    needs: [setup, create-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python_version }}

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Check packages with twine
        run: |
          echo "Running twine check..."
          twine check dist-python/*
          echo "✓ Package validation passed"

      - name: Upload flashinfer-python to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "Uploading flashinfer (sdist and wheel) to PyPI..."
          twine upload --verbose --non-interactive dist-python/*
          echo "✓ Successfully uploaded flashinfer to PyPI"

  update-wheel-index:
    needs: [setup, create-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flashinfer repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect wheels and sdist
        run: |
          mkdir -p dist
          find artifacts/ -name "*.whl" -exec cp {} dist/ \;
          find artifacts/ -name "*.tar.gz" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/flashinfer-ai/whl.git flashinfer-whl
        env:
          WHL_TOKEN: ${{ secrets.WHL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Update wheel index
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          python3 scripts/update_whl_index.py \
            --dist-dir dist \
            --output-dir flashinfer-whl \
            --release-tag "${RELEASE_TAG}"

      - name: Push wheel index
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd flashinfer-whl
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "update whl for release ${RELEASE_VERSION}"
          git push

  deploy-docs:
    needs: [setup, create-release, publish-to-pypi, update-wheel-index]
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-doc.yml
    with:
      release_tag: ${{ needs.setup.outputs.release_tag }}
