name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag (e.g., v1.2.3) to build and publish'
        required: true
        type: string
  pull_request:
    paths:
      - '.python-version'
      - '.github/workflows/release.yml'
      - 'build_utils.py'
      - 'ci/cuda-versions.json'
      - 'ci/validate_cuda_versions.py'
      - 'scripts/build_flashinfer_jit_cache_whl.sh'
      - 'scripts/jit_cache_build_common.sh'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.set-version.outputs.version }}
      release_tag: ${{ steps.set-version.outputs.release_tag }}
      is_pr: ${{ steps.set-version.outputs.is_pr }}
      jit_cache_cuda_matrix: ${{ steps.cuda-versions.outputs.jit_cache }}
      python_version: ${{ steps.set-version.outputs.python_version }}
    steps:
      - name: Determine if running in PR mode
        id: check-mode
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" == "pull_request" ]; then
            echo "is_pr=true" >> "$GITHUB_OUTPUT"
            echo "Running in PR mode (dry-run)"
          else
            echo "is_pr=false" >> "$GITHUB_OUTPUT"
            echo "Running in release mode"
          fi

      - name: Validate tag format
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_INPUT_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?$ ]]; then
            echo "Error: Tag '${RELEASE_INPUT_TAG}' does not match the expected format (e.g., v1.2.3 or v1.2.3.post1 or v1.2.3rc1)"
            exit 1
          fi
          echo "✓ Tag format is valid: ${RELEASE_INPUT_TAG}"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # A fork's head branch does not exist in the base repository, so use
          # its repository and immutable SHA for pull-request dry runs.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Validate CUDA configuration
        run: python3 ci/validate_cuda_versions.py

      - name: Verify tag matches version.txt
        id: set-version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_INPUT_TAG: ${{ inputs.tag }}
        run: |
          # Check version.txt - this is the source of truth
          if [ ! -f "version.txt" ]; then
            echo "Error: version.txt file not found!"
            exit 1
          fi

          VERSION_TXT=$(cat version.txt | tr -d '[:space:]')
          PYTHON_VERSION=$(tr -d '[:space:]' < .python-version)
          if [[ ! "${VERSION_TXT}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?$ ]]; then
            echo "Error: version.txt contains an invalid version: ${VERSION_TXT}"
            exit 1
          fi

          # In PR mode, use version from version.txt with a test suffix
          if [ "${EVENT_NAME}" == "pull_request" ]; then
            IS_PR=true
            RELEASE_TAG="test-v${VERSION_TXT}-pr${PR_NUMBER}"
            echo "✓ PR mode: using test tag ${RELEASE_TAG}"
          else
            # Extract version from tag (remove 'v' prefix)
            TAG_VERSION="${RELEASE_INPUT_TAG}"
            TAG_VERSION="${TAG_VERSION#v}"

            if [ "$TAG_VERSION" != "$VERSION_TXT" ]; then
              echo "❌ CRITICAL ERROR: version.txt does not match tag!"
              echo "  Tag version: $TAG_VERSION"
              echo "  version.txt: $VERSION_TXT"
              echo ""
              echo "Please update version.txt to match the release version before creating a release."
              echo "The tag should be 'v$VERSION_TXT' (e.g., if version.txt contains '1.2.3', tag should be 'v1.2.3')"
              exit 1
            fi

            IS_PR=false
            RELEASE_TAG="${RELEASE_INPUT_TAG}"
            echo "✓ version.txt matches tag version: $VERSION_TXT"
          fi

          {
            echo "python_version=${PYTHON_VERSION}"
            echo "is_pr=${IS_PR}"
            echo "version=${VERSION_TXT}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Load CUDA wheel matrix
        id: cuda-versions
        run: echo "jit_cache=$(jq -c '.jit_cache' ci/cuda-versions.json)" >> "$GITHUB_OUTPUT"

  build-flashinfer-python:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build flashinfer-python wheel and sdist
        run: |
          echo "Building flashinfer-python..."
          echo "Git commit: $(git rev-parse HEAD)"
          python -m build
          ls -lh dist/

      - name: Upload flashinfer-python artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist/*
          retention-days: 7

  build-flashinfer-cubin:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build flashinfer-cubin wheel
        run: |
          echo "Building flashinfer-cubin..."
          echo "Git commit: $(git rev-parse HEAD)"
          cd flashinfer-cubin
          rm -rf dist build *.egg-info
          python -m build --wheel
          ls -lh dist/
          mkdir -p ../dist
          cp dist/*.whl ../dist/

      - name: Upload flashinfer-cubin artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist/*.whl
          retention-days: 7

  build-flashinfer-jit-cache:
    name: JIT cache (${{ matrix.cuda.label }}, ${{ matrix.arch }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        cuda: ${{ fromJSON(needs.setup.outputs.jit_cache_cuda_matrix) }}
        arch: ['x86_64', 'aarch64']

    runs-on: [self-hosted, linux, "${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]

    steps:
      - name: Display Machine Information
        run: |
          echo "CPU: $(nproc) cores, $(lscpu | grep 'Model name' | cut -d':' -f2 | xargs)"
          echo "RAM: $(free -h | awk '/^Mem:/ {print $7 " available out of " $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $4 " available out of " $2}')"
          echo "Architecture: $(uname -m)"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.tag }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          submodules: true

      - name: Build wheel in container
        env:
          ARCH: ${{ matrix.arch }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CUDA_VERSION: ${{ matrix.cuda.version }}
          DOCKER_IMAGE: ${{ matrix.arch == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda.version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda.version) }}
          # Keep 12.1a on CUDA 13.x aarch64 only: including it in cu129 made
          # that wheel exceed GitHub's 2 GiB release-asset limit (#4519).
          FLASHINFER_CUDA_ARCH_LIST: ${{ matrix.arch == 'aarch64' && matrix.cuda.aarch64_arch_list || matrix.cuda.x86_64_arch_list }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda.label }}
          PYTORCH_INDEX: ${{ matrix.cuda.pytorch_index }}
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          # Extract CUDA major and minor versions
          IFS=. read -r CUDA_MAJOR CUDA_MINOR <<< "${CUDA_VERSION}"
          export CUDA_MAJOR
          export CUDA_MINOR

          mkdir -p "${GITHUB_WORKSPACE}/ci-cache" "${GITHUB_WORKSPACE}/sccache-stats"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${GITHUB_WORKSPACE}/ci-cache:/ci-cache" \
            -e FLASHINFER_CI_CACHE=/ci-cache \
            -e CUDA_VERSION \
            -e CUDA_MAJOR="$CUDA_MAJOR" \
            -e CUDA_MINOR="$CUDA_MINOR" \
            -e PYTORCH_INDEX \
            -e FLASHINFER_LOCAL_VERSION \
            -e ARCH \
            -e FLASHINFER_CUDA_ARCH_LIST \
            -e FLASHINFER_NVCC_THREADS="${FLASHINFER_NVCC_THREADS:-}" \
            -e SCCACHE_BUCKET \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e SCCACHE_REGION \
            -e SCCACHE_STATS_DIR=/workspace/sccache-stats \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash /workspace/scripts/build_flashinfer_jit_cache_whl.sh
        timeout-minutes: 360

      - name: Display sccache stats
        if: always()
        run: |
          STATS_FILE="${GITHUB_WORKSPACE}/sccache-stats/sccache-stats.txt"
          if [ -s "${STATS_FILE}" ]; then
            cat "${STATS_FILE}"
          else
            echo "::warning::sccache stats were not produced"
          fi

      - name: Record sccache job metadata
        if: always()
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_CUDA_LABEL: ${{ matrix.cuda.label }}
          MATRIX_CUDA_VERSION: ${{ matrix.cuda.version }}
          DOCKER_IMAGE: ${{ matrix.arch == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda.version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda.version) }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/sccache-stats"
          IMAGE_DIGESTS=$(docker image inspect --format '{{json .RepoDigests}}' "${DOCKER_IMAGE}" 2>/dev/null || printf 'unavailable')
          {
            printf 'git_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'docker_image=%s\n' "${DOCKER_IMAGE}"
            printf 'docker_image_repo_digests=%s\n' "${IMAGE_DIGESTS}"
            printf 'matrix_cuda=%s\n' "${MATRIX_CUDA_VERSION}"
            printf 'matrix_cuda_label=%s\n' "${MATRIX_CUDA_LABEL}"
            printf 'matrix_arch=%s\n' "${MATRIX_ARCH}"
          } > "${GITHUB_WORKSPACE}/sccache-stats/job-metadata.txt"

      - name: Upload sccache stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sccache-stats-${{ matrix.cuda.label }}-${{ matrix.arch }}
          path: sccache-stats/
          if-no-files-found: warn
          retention-days: 14

      - name: Display wheel size
        run: du -h flashinfer-jit-cache/dist/*

      - name: Create artifact name
        id: artifact-name
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_CUDA_LABEL: ${{ matrix.cuda.label }}
        run: |
          echo "name=jit-cache-${MATRIX_CUDA_LABEL}-${MATRIX_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Upload flashinfer-jit-cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: flashinfer-jit-cache/dist/*.whl
          retention-days: 7

  create-release:
    needs: [setup, build-flashinfer-python, build-flashinfer-cubin, build-flashinfer-jit-cache]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Generate release notes
        id: release-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          # Get the previous release tag
          PREV_TAG=$(git tag --sort=-version:refname | grep -A1 "^${RELEASE_TAG}$" | tail -n1 || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "No previous tag found, generating notes from all commits"
            NOTES=$(gh api "/repos/${REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="${TARGET_SHA}" \
              --jq '.body')
          else
            echo "Generating notes from ${PREV_TAG} to ${RELEASE_TAG}"
            NOTES=$(gh api "/repos/${REPOSITORY}/releases/generate-notes" \
              -f tag_name="${RELEASE_TAG}" \
              -f previous_tag_name="$PREV_TAG" \
              -f target_commitish="${TARGET_SHA}" \
              --jq '.body')
          fi

          # Save to file for multi-line output
          echo "$NOTES" > /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release (empty first)
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.release-notes.outputs.notes_file }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # Delete existing release and tag if they exist
          if gh release view "${RELEASE_TAG}" &>/dev/null; then
            echo "Deleting existing release: ${RELEASE_TAG}"
            gh release delete "${RELEASE_TAG}" --yes
          fi

          # Read release notes from file
          NOTES=$(cat "${NOTES_FILE}")

          # Create new release without assets first
          gh release create "${RELEASE_TAG}" \
            --title "Release v${RELEASE_VERSION}" \
            --notes "$NOTES"

      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Upload flashinfer-python to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-python/* --clobber

      - name: Download flashinfer-cubin artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist-cubin/

      - name: Upload flashinfer-cubin to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-cubin/* --clobber

      - name: Upload flashinfer-jit-cache wheels to release (one at a time to avoid OOM)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          # Upload jit-cache wheels one at a time to avoid OOM
          # Each wheel can be several GB, so we download, upload, delete, repeat
          mkdir -p dist-jit-cache

          mapfile -t CUDA_LABELS < <(jq -r '.jit_cache[].label' ci/cuda-versions.json)
          for cuda_label in "${CUDA_LABELS[@]}"; do
            for arch in x86_64 aarch64; do
              ARTIFACT_NAME="jit-cache-${cuda_label}-${arch}"
              echo "Processing ${ARTIFACT_NAME}..."

              # Download this specific artifact
              if ! gh run download "${GITHUB_RUN_ID}" -n "${ARTIFACT_NAME}" -D dist-jit-cache/; then
                echo "::error::Failed to download required artifact ${ARTIFACT_NAME}"
                exit 1
              fi

              shopt -s nullglob
              WHEELS=(dist-jit-cache/*.whl)
              shopt -u nullglob
              if [ "${#WHEELS[@]}" -eq 0 ]; then
                echo "::error::Required artifact ${ARTIFACT_NAME} contained no wheel"
                exit 1
              fi

              gh release upload "${RELEASE_TAG}" "${WHEELS[@]}" --clobber
              echo "✅ Uploaded ${ARTIFACT_NAME}"

              # Clean up to save disk space before next iteration
              rm -f -- "${WHEELS[@]}"
            done
          done

  publish-to-pypi:
    needs: [setup, create-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ needs.setup.outputs.python_version }}

      - name: Install twine
        run: |
          python -m pip install --upgrade pip
          pip install twine

      - name: Check packages with twine
        run: |
          echo "Running twine check..."
          twine check dist-python/*
          echo "✓ Package validation passed"

      - name: Upload flashinfer-python to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "Uploading flashinfer (sdist and wheel) to PyPI..."
          twine upload --verbose --non-interactive dist-python/*
          echo "✓ Successfully uploaded flashinfer to PyPI"

  update-wheel-index:
    needs: [setup, create-release]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flashinfer repo
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect wheels and sdist
        run: |
          mkdir -p dist
          find artifacts/ -name "*.whl" -exec cp {} dist/ \;
          find artifacts/ -name "*.tar.gz" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/flashinfer-ai/whl.git flashinfer-whl
        env:
          WHL_TOKEN: ${{ secrets.WHL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Update wheel index
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          python3 scripts/update_whl_index.py \
            --dist-dir dist \
            --output-dir flashinfer-whl \
            --release-tag "${RELEASE_TAG}"

      - name: Push wheel index
        env:
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          cd flashinfer-whl
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "update whl for release ${RELEASE_VERSION}"
          git push
