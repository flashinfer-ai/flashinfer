name: Nightly Release

env:
  NIGHTLY_RELEASE_REPOSITORY: flashinfer-ai/whl

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date_suffix:
        description: 'Date suffix for dev version (YYYYMMDD, leave empty for today)'
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      dev_suffix: ${{ steps.set-suffix.outputs.dev_suffix }}
      release_tag: ${{ steps.set-suffix.outputs.release_tag }}
      version: ${{ steps.set-suffix.outputs.version }}
      jit_cache_provider_matrix: ${{ steps.cuda-versions.outputs.providers }}
      jit_cache_shim_matrix: ${{ steps.cuda-versions.outputs.shims }}
      runtime_cuda_matrix: ${{ steps.cuda-versions.outputs.runtime }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate CUDA configuration
        run: python3 ci/validate_cuda_versions.py

      - name: Set date suffix and release tag
        id: set-suffix
        env:
          INPUT_DATE_SUFFIX: ${{ inputs.date_suffix }}
        run: |
          # Read version from version.txt
          VERSION=$(cat version.txt | tr -d '[:space:]')
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?$ ]]; then
            echo "Error: version.txt contains an invalid version: ${VERSION}"
            exit 1
          fi

          # Set date suffix
          if [ -n "${INPUT_DATE_SUFFIX}" ]; then
            DEV_SUFFIX="${INPUT_DATE_SUFFIX}"
          else
            DEV_SUFFIX=$(date -u +%Y%m%d)
          fi
          if [[ ! "${DEV_SUFFIX}" =~ ^[0-9]{8}$ ]]; then
            echo "Error: date suffix must use YYYYMMDD format: ${DEV_SUFFIX}"
            exit 1
          fi

          # Create release tag with version
          RELEASE_TAG="nightly-v${VERSION}-${DEV_SUFFIX}"
          if [[ ! "${RELEASE_TAG}" =~ ^nightly-v[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?-[0-9]{8}$ ]]; then
            echo "Error: generated an invalid nightly release tag: ${RELEASE_TAG}"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "dev_suffix=${DEV_SUFFIX}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Base version: ${VERSION}"
          echo "Using dev suffix: ${DEV_SUFFIX}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Load CUDA wheel matrix
        id: cuda-versions
        run: |
          echo "providers=$(python3 ci/validate_cuda_versions.py --matrix providers)" >> "$GITHUB_OUTPUT"
          echo "shims=$(python3 ci/validate_cuda_versions.py --matrix shims)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -c '.runtime' ci/cuda-versions.json)" >> "$GITHUB_OUTPUT"

  build-flashinfer-python:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build flashinfer-python wheel and sdist
        env:
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
        run: |
          echo "Building flashinfer-python with dev suffix: ${FLASHINFER_DEV_RELEASE_SUFFIX}"
          echo "Git commit: $(git rev-parse HEAD)"
          python -m build
          ls -lh dist/

      - name: Upload flashinfer-python artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist/*
          retention-days: 7

  build-flashinfer-cubin:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build flashinfer-cubin wheel
        env:
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
        run: |
          echo "Building flashinfer-cubin with dev suffix: ${FLASHINFER_DEV_RELEASE_SUFFIX}"
          echo "Git commit: $(git rev-parse HEAD)"
          cd flashinfer-cubin
          rm -rf dist build *.egg-info
          python -m build --wheel
          ls -lh dist/
          mkdir -p ../dist
          cp dist/*.whl ../dist/

      - name: Upload flashinfer-cubin artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist/*.whl
          retention-days: 7

  build-flashinfer-jit-cache-provider-sccache:
    name: Provider sccache (cu134, ${{ matrix.cpu_architecture }})
    needs: setup
    strategy:
      matrix:
        cpu_architecture: [x86_64, aarch64]
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Cleanup
        run: |
          docker ps -q | xargs -r docker stop || true
          docker ps -aq | xargs -r docker rm || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build patched sccache
        env:
          CUDA_VERSION: '13.4'
          DOCKER_IMAGE: ${{ matrix.cpu_architecture == 'aarch64' && 'pytorch/manylinuxaarch64-builder:cuda13.4' || 'pytorch/manylinux2_28-builder:cuda13.4' }}
          SCCACHE_PATCHED_BINARY_PATH: /ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}/sccache
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-cache"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${GITHUB_WORKSPACE}/ci-cache:/ci-cache" \
            -e CUDA_VERSION \
            -e SCCACHE_PATCHED_BINARY_PATH \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash /workspace/scripts/build_patched_sccache.sh

      - name: Upload patched sccache
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-sccache-cu134-${{ matrix.cpu_architecture }}
          path: ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}/sccache
          retention-days: 7

  build-flashinfer-jit-cache-provider:
    name: JIT cache provider (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }}, ${{ matrix.provider_tag }})
    needs: [setup, build-flashinfer-jit-cache-provider-sccache]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_provider_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Cleanup
        run: |
          docker ps -q | xargs -r docker stop || true
          docker ps -aq | xargs -r docker rm || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download patched sccache
        if: matrix.cuda_label == 'cu134'
        uses: actions/download-artifact@v4
        with:
          name: jit-cache-sccache-cu134-${{ matrix.cpu_architecture }}
          path: ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}

      - name: Make patched sccache executable
        if: matrix.cuda_label == 'cu134'
        run: chmod +x ci-cache/sccache-cu134/${{ matrix.cpu_architecture }}/sccache

      - name: Build and validate provider wheel
        env:
          ARCH: ${{ matrix.cpu_architecture }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          DOCKER_IMAGE: ${{ matrix.cpu_architecture == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda_version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda_version) }}
          FLASHINFER_CI_CACHE: ${{ github.workspace }}/ci-cache
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
          FLASHINFER_JIT_CACHE_BUILD_TARGET: provider
          FLASHINFER_JIT_CACHE_PROVIDER_ARCH: ${{ matrix.provider_architecture }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda_label }}
          PYTORCH_INDEX: ${{ matrix.pytorch_index }}
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: bash scripts/build_flashinfer_jit_cache_artifact.sh
        timeout-minutes: 360

      - name: Upload provider artifact
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-provider-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}-${{ matrix.provider_tag }}
          path: flashinfer-jit-cache-provider/dist/*
          retention-days: 7

  build-flashinfer-jit-cache-shim:
    name: JIT cache shim (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_shim_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Cleanup
        run: |
          docker ps -q | xargs -r docker stop || true
          docker ps -aq | xargs -r docker rm || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build shim wheel
        env:
          ARCH: ${{ matrix.cpu_architecture }}
          CUDA_VERSION: ${{ matrix.cuda_version }}
          DOCKER_IMAGE: ${{ matrix.cpu_architecture == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda_version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda_version) }}
          FLASHINFER_CI_CACHE: ${{ github.workspace }}/ci-cache
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
          FLASHINFER_JIT_CACHE_BUILD_TARGET: shim
          FLASHINFER_JIT_CACHE_PROVIDER_ARCHS: ${{ matrix.provider_architectures }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda_label }}
          PYTORCH_INDEX: ${{ matrix.pytorch_index }}
        run: bash scripts/build_flashinfer_jit_cache_artifact.sh
        timeout-minutes: 60

      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-shim-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}
          path: flashinfer-jit-cache/dist/*.whl
          retention-days: 7

  validate-flashinfer-jit-cache-providers:
    name: Validate provider set (${{ matrix.cuda_label }}, ${{ matrix.cpu_architecture }})
    needs: [setup, build-flashinfer-jit-cache-provider, build-flashinfer-jit-cache-shim]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.jit_cache_shim_matrix) }}
    runs-on: [self-hosted, linux, "${{ matrix.cpu_architecture == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download provider artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jit-cache-provider-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}-*
          path: wheelhouse
          merge-multiple: true

      - name: Download shim artifact
        uses: actions/download-artifact@v4
        with:
          name: jit-cache-shim-${{ matrix.cuda_label }}-${{ matrix.cpu_architecture }}
          path: wheelhouse

      - name: Verify default and minimal installation
        env:
          EXPECTED_PROVIDERS: ${{ matrix.provider_tags }}
          EXPECTED_VERSION: ${{ needs.setup.outputs.version }}.dev${{ needs.setup.outputs.dev_suffix }}+${{ matrix.cuda_label }}
          PLATFORM_TAG: manylinux_2_28_${{ matrix.cpu_architecture }}
        run: |
          read -ra PROVIDERS <<< "${EXPECTED_PROVIDERS}"
          python3 scripts/verify_jit_cache_provider_release.py \
            --wheelhouse wheelhouse \
            --version "${EXPECTED_VERSION}" \
            --providers "${PROVIDERS[@]}" \
            --provider-platform-tag "${PLATFORM_TAG}" \
            --install-smoke

  create-release:
    needs: [setup, build-flashinfer-python, build-flashinfer-cubin, build-flashinfer-jit-cache-provider, build-flashinfer-jit-cache-shim, validate-flashinfer-jit-cache-providers]
    # Publish only from main: a workflow_dispatch on any other branch runs the
    # builds and tests as a dry run without touching the nightly release/index.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create nightly release in wheel repository (empty first)
        env:
          # Requires contents: write access to NIGHTLY_RELEASE_REPOSITORY.
          GH_TOKEN: ${{ secrets.WHL_TOKEN }}
          RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # Delete existing release and tag if they exist
          if gh release view "${RELEASE_TAG}" --repo "${NIGHTLY_RELEASE_REPOSITORY}" &>/dev/null; then
            echo "Deleting existing release: ${RELEASE_TAG}"
            gh release delete "${RELEASE_TAG}" \
              --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
              --yes \
              --cleanup-tag
          fi

          # Create new release without assets first
          gh release create "${RELEASE_TAG}" \
            --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
            --title "Nightly Release v${RELEASE_VERSION}-${RELEASE_SUFFIX}" \
            --notes "Automated nightly build for version ${RELEASE_VERSION} (dev${RELEASE_SUFFIX})" \
            --prerelease

      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Upload flashinfer-python to wheel release
        env:
          GH_TOKEN: ${{ secrets.WHL_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-python/* \
            --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
            --clobber

      - name: Download flashinfer-cubin artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist-cubin/

      - name: Upload flashinfer-cubin to wheel release
        env:
          GH_TOKEN: ${{ secrets.WHL_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-cubin/* \
            --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
            --clobber

      - name: Upload provider and shim wheels to wheel release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          WHL_TOKEN: ${{ secrets.WHL_TOKEN }}
        run: |
          mapfile -t CUDA_LABELS < <(jq -r '.jit_cache[].label' ci/cuda-versions.json)
          for cuda_label in "${CUDA_LABELS[@]}"; do
            for arch in x86_64 aarch64; do
              rm -rf dist-jit-cache
              mkdir -p dist-jit-cache
              gh run download "${GITHUB_RUN_ID}" \
                --pattern "jit-cache-provider-${cuda_label}-${arch}-*" \
                --dir dist-jit-cache
              gh run download "${GITHUB_RUN_ID}" \
                --name "jit-cache-shim-${cuda_label}-${arch}" \
                --dir dist-jit-cache

              while IFS= read -r wheel; do
                GH_TOKEN="${WHL_TOKEN}" gh release upload "${RELEASE_TAG}" "${wheel}" \
                  --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
                  --clobber
              done < <(find dist-jit-cache -type f -name '*.whl' -print)
            done
          done

  test-nightly-build:
    needs: [setup, build-flashinfer-python, build-flashinfer-cubin, build-flashinfer-jit-cache-provider, build-flashinfer-jit-cache-shim, validate-flashinfer-jit-cache-providers]
    strategy:
      fail-fast: false
      matrix:
        cuda: ${{ fromJSON(needs.setup.outputs.runtime_cuda_matrix) }}
        test-shard: [1, 2, 3, 4, 5]
    runs-on: [self-hosted, linux, x64, gpu, sm86, on-demand]

    steps:
      - name: Cleanup
        run: |
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Display Machine Information
        run: |
          echo "CPU: $(nproc) cores, $(lscpu | grep 'Model name' | cut -d':' -f2 | xargs)"
          echo "RAM: $(free -h | awk '/^Mem:/ {print $7 " available out of " $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $4 " available out of " $2}')"
          echo "Architecture: $(uname -m)"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Download flashinfer-cubin artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist-cubin/

      - name: Download flashinfer-jit-cache provider artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jit-cache-provider-${{ matrix.cuda.label }}-x86_64-*
          path: dist-jit-cache/
          merge-multiple: true

      - name: Download flashinfer-jit-cache shim artifact
        uses: actions/download-artifact@v4
        with:
          name: jit-cache-shim-${{ matrix.cuda.label }}-x86_64
          path: dist-jit-cache/

      - name: Get Docker image tag
        id: docker-tag
        env:
          CUDA_LABEL: ${{ matrix.cuda.label }}
        run: |
          DOCKER_TAG=$(grep "flashinfer/flashinfer-ci-${CUDA_LABEL}" ci/docker-tags.yml | cut -d':' -f2 | tr -d ' ')
          echo "cuda_version=${CUDA_LABEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run nightly build tests in Docker (shard ${{ matrix.test-shard }})
        env:
          CUDA_VERSION: ${{ matrix.cuda.version }}
          CUDA_VISIBLE_DEVICES: 0
          DOCKER_IMAGE: flashinfer/flashinfer-ci-${{ steps.docker-tag.outputs.cuda_version }}:${{ steps.docker-tag.outputs.tag }}
          TEST_SHARD: ${{ matrix.test-shard }}
        run: |
          REPORT_FILE="/workspace/jit_cache_report_shard${TEST_SHARD}_cuda${CUDA_VERSION}.json"
          bash ci/bash.sh "${DOCKER_IMAGE}" \
            -e TEST_SHARD "${TEST_SHARD}" \
            -e FLASHINFER_JIT_CACHE_REPORT_FILE "${REPORT_FILE}" \
            ./scripts/task_test_nightly_build.sh

      - name: Upload JIT cache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-report-shard${{ matrix.test-shard }}-cuda${{ matrix.cuda.version }}
          path: jit_cache_report_shard${{ matrix.test-shard }}_cuda${{ matrix.cuda.version }}.json
          if-no-files-found: ignore
          retention-days: 7

  jit-cache-summary:
    needs: test-nightly-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Download all JIT cache reports
        uses: actions/download-artifact@v4
        with:
          pattern: jit-cache-report-*
          path: jit-reports/
          merge-multiple: true

      - name: Merge and print JIT cache summary
        run: |
          # Merge all report files into one
          mkdir -p merged-reports
          cat jit-reports/*.json > merged-reports/all_reports.json 2>/dev/null || echo "No JIT cache reports found"

          # Print summary
          if [ -f merged-reports/all_reports.json ] && [ -s merged-reports/all_reports.json ]; then
            python scripts/print_jit_cache_summary.py merged-reports/all_reports.json
          else
            echo "✅ No missing JIT cache modules - all tests passed!"
          fi

  update-wheel-index:
    needs: [setup, create-release, test-nightly-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flashinfer repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect wheels and sdist
        run: |
          mkdir -p dist
          find artifacts/ -name "*.whl" -exec cp {} dist/ \;
          find artifacts/ -name "*.tar.gz" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/flashinfer-ai/whl.git flashinfer-whl
        env:
          WHL_TOKEN: ${{ secrets.WHL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Update wheel index
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          python3 scripts/update_whl_index.py \
            --dist-dir dist \
            --output-dir flashinfer-whl \
            --base-url "https://github.com/${NIGHTLY_RELEASE_REPOSITORY}/releases/download" \
            --release-tag "${RELEASE_TAG}" \
            --nightly

      - name: Push wheel index
        env:
          RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
        run: |
          cd flashinfer-whl
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "update whl for nightly ${RELEASE_SUFFIX}"
          git push
