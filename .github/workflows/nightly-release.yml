name: Nightly Release

env:
  NIGHTLY_RELEASE_REPOSITORY: flashinfer-ai/whl

on:
  schedule:
    # Run at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      date_suffix:
        description: 'Date suffix for dev version (YYYYMMDD, leave empty for today)'
        required: false
        type: string

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      dev_suffix: ${{ steps.set-suffix.outputs.dev_suffix }}
      release_tag: ${{ steps.set-suffix.outputs.release_tag }}
      version: ${{ steps.set-suffix.outputs.version }}
      jit_cache_cuda_matrix: ${{ steps.cuda-versions.outputs.jit_cache }}
      runtime_cuda_matrix: ${{ steps.cuda-versions.outputs.runtime }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate CUDA configuration
        run: python3 ci/validate_cuda_versions.py

      - name: Set date suffix and release tag
        id: set-suffix
        env:
          INPUT_DATE_SUFFIX: ${{ inputs.date_suffix }}
        run: |
          # Read version from version.txt
          VERSION=$(cat version.txt | tr -d '[:space:]')
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?$ ]]; then
            echo "Error: version.txt contains an invalid version: ${VERSION}"
            exit 1
          fi

          # Set date suffix
          if [ -n "${INPUT_DATE_SUFFIX}" ]; then
            DEV_SUFFIX="${INPUT_DATE_SUFFIX}"
          else
            DEV_SUFFIX=$(date -u +%Y%m%d)
          fi
          if [[ ! "${DEV_SUFFIX}" =~ ^[0-9]{8}$ ]]; then
            echo "Error: date suffix must use YYYYMMDD format: ${DEV_SUFFIX}"
            exit 1
          fi

          # Create release tag with version
          RELEASE_TAG="nightly-v${VERSION}-${DEV_SUFFIX}"
          if [[ ! "${RELEASE_TAG}" =~ ^nightly-v[0-9]+\.[0-9]+\.[0-9]+(\.?[a-z][a-z0-9]*)?-[0-9]{8}$ ]]; then
            echo "Error: generated an invalid nightly release tag: ${RELEASE_TAG}"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "dev_suffix=${DEV_SUFFIX}"
            echo "release_tag=${RELEASE_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Base version: ${VERSION}"
          echo "Using dev suffix: ${DEV_SUFFIX}"
          echo "Release tag: ${RELEASE_TAG}"

      - name: Load CUDA wheel matrix
        id: cuda-versions
        run: |
          echo "jit_cache=$(jq -c '.jit_cache' ci/cuda-versions.json)" >> "$GITHUB_OUTPUT"
          echo "runtime=$(jq -c '.runtime' ci/cuda-versions.json)" >> "$GITHUB_OUTPUT"

  build-flashinfer-python:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel

      - name: Build flashinfer-python wheel and sdist
        env:
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
        run: |
          echo "Building flashinfer-python with dev suffix: ${FLASHINFER_DEV_RELEASE_SUFFIX}"
          echo "Git commit: $(git rev-parse HEAD)"
          python -m build
          ls -lh dist/

      - name: Upload flashinfer-python artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist/*
          retention-days: 7

  build-flashinfer-cubin:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel

      - name: Build flashinfer-cubin wheel
        env:
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
        run: |
          echo "Building flashinfer-cubin with dev suffix: ${FLASHINFER_DEV_RELEASE_SUFFIX}"
          echo "Git commit: $(git rev-parse HEAD)"
          cd flashinfer-cubin
          rm -rf dist build *.egg-info
          python -m build --wheel
          ls -lh dist/
          mkdir -p ../dist
          cp dist/*.whl ../dist/

      - name: Upload flashinfer-cubin artifact
        uses: actions/upload-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist/*.whl
          retention-days: 7

  build-flashinfer-jit-cache:
    name: JIT cache (${{ matrix.cuda.label }}, ${{ matrix.arch }})
    needs: setup
    strategy:
      fail-fast: false
      matrix:
        cuda: ${{ fromJSON(needs.setup.outputs.jit_cache_cuda_matrix) }}
        arch: ['x86_64', 'aarch64']

    runs-on: [self-hosted, linux, "${{ matrix.arch == 'aarch64' && 'arm64' || 'x64' }}", cpu, on-demand]

    steps:
      - name: Cleanup
        run: |
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Display Machine Information
        run: |
          echo "CPU: $(nproc) cores, $(lscpu | grep 'Model name' | cut -d':' -f2 | xargs)"
          echo "RAM: $(free -h | awk '/^Mem:/ {print $7 " available out of " $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $4 " available out of " $2}')"
          echo "Architecture: $(uname -m)"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build patched sccache (${{ matrix.arch }})
        if: ${{ matrix.cuda.label == 'cu134' }}
        env:
          CUDA_VERSION: ${{ matrix.cuda.version }}
          DOCKER_IMAGE: ${{ matrix.arch == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda.version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda.version) }}
          SCCACHE_PATCHED_BINARY_PATH: /ci-cache/sccache-cu134/${{ matrix.arch }}/sccache
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/ci-cache"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${GITHUB_WORKSPACE}/ci-cache:/ci-cache" \
            -e CUDA_VERSION \
            -e SCCACHE_PATCHED_BINARY_PATH \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash /workspace/scripts/build_patched_sccache.sh
        timeout-minutes: 30

      - name: Build wheel in container
        env:
          ARCH: ${{ matrix.arch }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
          CUDA_VERSION: ${{ matrix.cuda.version }}
          DOCKER_IMAGE: ${{ matrix.arch == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda.version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda.version) }}
          # Keep size-constrained architecture coverage centralized in
          # ci/cuda-versions.json so release and nightly wheels stay aligned.
          FLASHINFER_CUDA_ARCH_LIST: ${{ matrix.arch == 'aarch64' && matrix.cuda.aarch64_arch_list || matrix.cuda.x86_64_arch_list }}
          FLASHINFER_DEV_RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
          FLASHINFER_LOCAL_VERSION: ${{ matrix.cuda.label }}
          PYTORCH_INDEX: ${{ matrix.cuda.pytorch_index }}
          SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          SCCACHE_PATCHED_BINARY_PATH: /ci-cache/sccache-cu134/${{ matrix.arch }}/sccache
          SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
        run: |
          # Extract CUDA major and minor versions
          IFS=. read -r CUDA_MAJOR CUDA_MINOR <<< "${CUDA_VERSION}"
          export CUDA_MAJOR
          export CUDA_MINOR

          mkdir -p "${GITHUB_WORKSPACE}/ci-cache" "${GITHUB_WORKSPACE}/sccache-stats"

          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -v "${GITHUB_WORKSPACE}/ci-cache:/ci-cache" \
            -e FLASHINFER_CI_CACHE=/ci-cache \
            -e CUDA_VERSION \
            -e CUDA_MAJOR="$CUDA_MAJOR" \
            -e CUDA_MINOR="$CUDA_MINOR" \
            -e PYTORCH_INDEX \
            -e FLASHINFER_LOCAL_VERSION \
            -e FLASHINFER_DEV_RELEASE_SUFFIX \
            -e ARCH \
            -e FLASHINFER_CUDA_ARCH_LIST \
            -e FLASHINFER_NVCC_THREADS="${FLASHINFER_NVCC_THREADS:-}" \
            -e SCCACHE_BUCKET \
            -e SCCACHE_PATCHED_BINARY_PATH \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e SCCACHE_REGION \
            -e SCCACHE_STATS_DIR=/workspace/sccache-stats \
            -w /workspace \
            "${DOCKER_IMAGE}" \
            bash /workspace/scripts/build_flashinfer_jit_cache_whl.sh
        timeout-minutes: 360

      - name: Display sccache stats
        if: always()
        run: |
          STATS_FILE="${GITHUB_WORKSPACE}/sccache-stats/sccache-stats.txt"
          if [ -s "${STATS_FILE}" ]; then
            cat "${STATS_FILE}"
          else
            echo "::warning::sccache stats were not produced"
          fi

      - name: Record sccache job metadata
        if: always()
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_CUDA_LABEL: ${{ matrix.cuda.label }}
          MATRIX_CUDA_VERSION: ${{ matrix.cuda.version }}
          DOCKER_IMAGE: ${{ matrix.arch == 'aarch64' && format('pytorch/manylinuxaarch64-builder:cuda{0}', matrix.cuda.version) || format('pytorch/manylinux2_28-builder:cuda{0}', matrix.cuda.version) }}
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/sccache-stats"
          IMAGE_DIGESTS=$(docker image inspect --format '{{json .RepoDigests}}' "${DOCKER_IMAGE}" 2>/dev/null || printf 'unavailable')
          {
            printf 'git_commit=%s\n' "$(git rev-parse HEAD)"
            printf 'docker_image=%s\n' "${DOCKER_IMAGE}"
            printf 'docker_image_repo_digests=%s\n' "${IMAGE_DIGESTS}"
            printf 'matrix_cuda=%s\n' "${MATRIX_CUDA_VERSION}"
            printf 'matrix_cuda_label=%s\n' "${MATRIX_CUDA_LABEL}"
            printf 'matrix_arch=%s\n' "${MATRIX_ARCH}"
          } > "${GITHUB_WORKSPACE}/sccache-stats/job-metadata.txt"

      - name: Upload sccache stats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sccache-stats-${{ matrix.cuda.label }}-${{ matrix.arch }}
          path: sccache-stats/
          if-no-files-found: warn
          retention-days: 14

      - name: Display wheel size
        run: du -h flashinfer-jit-cache/dist/*

      - name: Create artifact name
        id: artifact-name
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_CUDA_LABEL: ${{ matrix.cuda.label }}
        run: |
          echo "name=jit-cache-${MATRIX_CUDA_LABEL}-${MATRIX_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Upload flashinfer-jit-cache artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: flashinfer-jit-cache/dist/*.whl
          retention-days: 7

  create-release:
    needs: [setup, build-flashinfer-python, build-flashinfer-cubin, build-flashinfer-jit-cache]
    # Publish only from main: a workflow_dispatch on any other branch runs the
    # builds and tests as a dry run without touching the nightly release/index.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create nightly release in wheel repository (empty first)
        env:
          # Requires contents: write access to NIGHTLY_RELEASE_REPOSITORY.
          GH_TOKEN: ${{ secrets.WHL_TOKEN }}
          RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.setup.outputs.version }}
        run: |
          # Delete existing release and tag if they exist
          if gh release view "${RELEASE_TAG}" --repo "${NIGHTLY_RELEASE_REPOSITORY}" &>/dev/null; then
            echo "Deleting existing release: ${RELEASE_TAG}"
            gh release delete "${RELEASE_TAG}" \
              --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
              --yes \
              --cleanup-tag
          fi

          # Create new release without assets first
          gh release create "${RELEASE_TAG}" \
            --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
            --title "Nightly Release v${RELEASE_VERSION}-${RELEASE_SUFFIX}" \
            --notes "Automated nightly build for version ${RELEASE_VERSION} (dev${RELEASE_SUFFIX})" \
            --prerelease

      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Upload flashinfer-python to wheel release
        env:
          GH_TOKEN: ${{ secrets.WHL_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-python/* \
            --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
            --clobber

      - name: Download flashinfer-cubin artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist-cubin/

      - name: Upload flashinfer-cubin to wheel release
        env:
          GH_TOKEN: ${{ secrets.WHL_TOKEN }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          gh release upload "${RELEASE_TAG}" dist-cubin/* \
            --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
            --clobber

      - name: Upload flashinfer-jit-cache wheels to wheel release (one at a time to avoid OOM)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
          WHL_TOKEN: ${{ secrets.WHL_TOKEN }}
        run: |
          # Upload jit-cache wheels one at a time to avoid OOM
          # Each wheel can be several GB, so we download, upload, delete, repeat
          mkdir -p dist-jit-cache

          mapfile -t CUDA_LABELS < <(jq -r '.jit_cache[].label' ci/cuda-versions.json)
          for cuda_label in "${CUDA_LABELS[@]}"; do
            for arch in x86_64 aarch64; do
              ARTIFACT_NAME="jit-cache-${cuda_label}-${arch}"
              echo "Processing ${ARTIFACT_NAME}..."

              # Download this specific artifact
              if ! gh run download "${GITHUB_RUN_ID}" -n "${ARTIFACT_NAME}" -D dist-jit-cache/; then
                echo "::error::Failed to download required artifact ${ARTIFACT_NAME}"
                exit 1
              fi

              shopt -s nullglob
              WHEELS=(dist-jit-cache/*.whl)
              shopt -u nullglob
              if [ "${#WHEELS[@]}" -eq 0 ]; then
                echo "::error::Required artifact ${ARTIFACT_NAME} contained no wheel"
                exit 1
              fi

              GH_TOKEN="${WHL_TOKEN}" gh release upload "${RELEASE_TAG}" "${WHEELS[@]}" \
                --repo "${NIGHTLY_RELEASE_REPOSITORY}" \
                --clobber
              echo "✅ Uploaded ${ARTIFACT_NAME} to wheel release repository"

              # Clean up to save disk space before next iteration
              rm -f -- "${WHEELS[@]}"
            done
          done

  test-nightly-build:
    needs: [setup, build-flashinfer-python, build-flashinfer-cubin, build-flashinfer-jit-cache]
    strategy:
      fail-fast: false
      matrix:
        cuda: ${{ fromJSON(needs.setup.outputs.runtime_cuda_matrix) }}
        test-shard: [1, 2, 3, 4, 5]
    runs-on: [self-hosted, linux, x64, gpu, sm86, on-demand]

    steps:
      - name: Cleanup
        run: |
          docker stop $(docker ps -q) 2>/dev/null || true
          docker rm $(docker ps -aq) 2>/dev/null || true
          sudo rm -rf ${{ github.workspace }}/* || true
          sudo rm -rf ${{ github.workspace }}/.[!.]* || true
          docker system prune -f || true

      - name: Display Machine Information
        run: |
          echo "CPU: $(nproc) cores, $(lscpu | grep 'Model name' | cut -d':' -f2 | xargs)"
          echo "RAM: $(free -h | awk '/^Mem:/ {print $7 " available out of " $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $4 " available out of " $2}')"
          echo "Architecture: $(uname -m)"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download flashinfer-python artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-python-dist
          path: dist-python/

      - name: Download flashinfer-cubin artifact
        uses: actions/download-artifact@v4
        with:
          name: flashinfer-cubin-wheel
          path: dist-cubin/

      - name: Download flashinfer-jit-cache artifact
        uses: actions/download-artifact@v4
        with:
          name: jit-cache-${{ matrix.cuda.label }}-x86_64
          path: dist-jit-cache/

      - name: Get Docker image tag
        id: docker-tag
        env:
          CUDA_LABEL: ${{ matrix.cuda.label }}
        run: |
          DOCKER_TAG=$(grep "flashinfer/flashinfer-ci-${CUDA_LABEL}" ci/docker-tags.yml | cut -d':' -f2 | tr -d ' ')
          echo "cuda_version=${CUDA_LABEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run nightly build tests in Docker (shard ${{ matrix.test-shard }})
        env:
          CUDA_VERSION: ${{ matrix.cuda.version }}
          CUDA_VISIBLE_DEVICES: 0
          DOCKER_IMAGE: flashinfer/flashinfer-ci-${{ steps.docker-tag.outputs.cuda_version }}:${{ steps.docker-tag.outputs.tag }}
          TEST_SHARD: ${{ matrix.test-shard }}
        run: |
          REPORT_FILE="/workspace/jit_cache_report_shard${TEST_SHARD}_cuda${CUDA_VERSION}.json"
          bash ci/bash.sh "${DOCKER_IMAGE}" \
            -e TEST_SHARD "${TEST_SHARD}" \
            -e FLASHINFER_JIT_CACHE_REPORT_FILE "${REPORT_FILE}" \
            ./scripts/task_test_nightly_build.sh

      - name: Upload JIT cache report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jit-cache-report-shard${{ matrix.test-shard }}-cuda${{ matrix.cuda.version }}
          path: jit_cache_report_shard${{ matrix.test-shard }}_cuda${{ matrix.cuda.version }}.json
          if-no-files-found: ignore
          retention-days: 7

  jit-cache-summary:
    needs: test-nightly-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Download all JIT cache reports
        uses: actions/download-artifact@v4
        with:
          pattern: jit-cache-report-*
          path: jit-reports/
          merge-multiple: true

      - name: Merge and print JIT cache summary
        run: |
          # Merge all report files into one
          mkdir -p merged-reports
          cat jit-reports/*.json > merged-reports/all_reports.json 2>/dev/null || echo "No JIT cache reports found"

          # Print summary
          if [ -f merged-reports/all_reports.json ] && [ -s merged-reports/all_reports.json ]; then
            python scripts/print_jit_cache_summary.py merged-reports/all_reports.json
          else
            echo "✅ No missing JIT cache modules - all tests passed!"
          fi

  update-wheel-index:
    needs: [setup, create-release, test-nightly-build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout flashinfer repo
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Collect wheels and sdist
        run: |
          mkdir -p dist
          find artifacts/ -name "*.whl" -exec cp {} dist/ \;
          find artifacts/ -name "*.tar.gz" -exec cp {} dist/ \;
          ls -lh dist/

      - name: Clone wheel index
        run: git clone https://oauth2:${WHL_TOKEN}@github.com/flashinfer-ai/whl.git flashinfer-whl
        env:
          WHL_TOKEN: ${{ secrets.WHL_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Update wheel index
        env:
          RELEASE_TAG: ${{ needs.setup.outputs.release_tag }}
        run: |
          python3 scripts/update_whl_index.py \
            --dist-dir dist \
            --output-dir flashinfer-whl \
            --base-url "https://github.com/${NIGHTLY_RELEASE_REPOSITORY}/releases/download" \
            --release-tag "${RELEASE_TAG}" \
            --nightly

      - name: Push wheel index
        env:
          RELEASE_SUFFIX: ${{ needs.setup.outputs.dev_suffix }}
        run: |
          cd flashinfer-whl
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "update whl for nightly ${RELEASE_SUFFIX}"
          git push
