name: PR API Compatibility

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: write
  issues: read
  actions: read
  statuses: write

jobs:
  api:
    if: github.event.action != 'edited' || github.event.changes.base.ref != null
    name: Trusted API compatibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: api-compatibility-${{ github.repository }}-${{ github.event.pull_request.number }}
      queue: max
    steps:
      - name: Mark current API gate pending
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const target_url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const name of ['API compatibility', `api-scan/pr-${pr.number}`]) {
              await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.head.sha, context: name, state: 'pending', description: 'Preparing trusted API scan', target_url });
            }
      # Never checkout or execute the PR head in this privileged workflow.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test trusted API policy and gate
        run: |
          python3 -m unittest discover -s scripts/infra/tests -p 'test*api*.py' -v
          node --test scripts/infra/tests/test_api_*.cjs
      - name: Scan git objects and publish API gate
        uses: actions/github-script@v7
        with:
          script: |
            const gate = require('./scripts/infra/pr_checks/api_gate.cjs');
            await gate.runScan({ github, core, context });
      - name: Upload trusted API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-public-api-report
          path: reports/public-api.json
          if-no-files-found: warn
      - name: Fail API gate if workflow execution failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            for (const name of ['API compatibility', `api-scan/pr-${pr.number}`]) {
              await github.rest.repos.createCommitStatus({ ...context.repo, sha: pr.head.sha, context: name, state: 'error', description: 'Trusted API workflow did not complete', target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` });
            }
