[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "flashinfer-jit-cache"
dynamic = ["version", "dependencies"]
description = "JIT cache provider shim for FlashInfer"
readme = {text = "This package installs and discovers compatible pre-compiled FlashInfer JIT cache providers.", content-type = "text/plain"}
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "FlashInfer team"},
]
maintainers = [
    {name = "FlashInfer team"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
[project.urls]
Homepage = "https://github.com/flashinfer-ai/flashinfer"
Documentation = "https://github.com/flashinfer-ai/flashinfer"
Repository = "https://github.com/flashinfer-ai/flashinfer"
"Issue Tracker" = "https://github.com/flashinfer-ai/flashinfer/issues"

[tool.setuptools]
packages = ["flashinfer_jit_cache"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "flashinfer_jit_cache.__version__"}
dependencies = {file = ["flashinfer_jit_cache/_provider_requirements.txt"]}
