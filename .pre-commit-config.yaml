# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://github.com/pre-commit/pre-commit
# Note the pre-commit hooks shoule only be used for formatting, but not for linting.
# For linting consider using CI.

# The kernel_src */src trees and blackwell_msa CUDA snapshots are generated or
# upstream kernel drops that are re-synced periodically
# (sm100/cutedsl_megamoe, sm90/pull_style_cutedsl_megakernel,
# sm120/swapab_cutedsl_megakernel);
# excluded from all hooks so formatting/lint churn doesn't block syncs or alter
# the source-distributed kernel payload.
# The shim/ layers next to them are ours and stay checked.
# The Cake selective-state, Mamba, and warp-decode CUDA/host trees, along with
# frozen KDA fallback sources, are byte-faithful generated exports; their
# SHA-256 digests are checked by JIT manifests and must not be rewritten.
exclude: ^(?:csrc/(?:blackwell_msa/|cake_all_gather_matmul/|cake_selective_state_update/(?:cuda|host)/|cake_mamba_ssd_combined/generated/|fused_moe/warp_decode/generated/|kda/training_(?:fallback|grouped_row_wg8)_pointer_sm_(?:100a|103a)\.cu)|flashinfer/moe_ep/kernel_src/(?:cutedsl_megamoe|sm90/pull_style_cutedsl_megakernel|sm120/swapab_cutedsl_megakernel)/src/)

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Changes tabs to spaces
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-tabs
      - id: remove-crlf

  # Formatters
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        # Source-export directories are checksum-attested generated artifacts;
        # formatting them would break parity with their producer manifests.
        exclude: |
          (?x)^(3rdparty/.*|flashinfer/jit/aot_config.py|csrc/cake_vsa/.*|csrc/cake_grouped_mxfp8_quantize/.*|csrc/dcp/.*|csrc/cake_fmha/.*)$

  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: 'v1.17.1'  # Use the sha / tag you want to point at
      hooks:
      -   id: mypy
          args: ["--config-file", "pyproject.toml", "--exclude", "flashinfer-cubin/"]
          files: ^flashinfer/
          exclude: ^(flashinfer-cubin/|flashinfer/attention/prims_ts/kernels/|3rdparty/|build/|flashinfer/cute_dsl/attention/fmha/(fmha\.py|fmha_blockscaled\.py|helpers/)|flashinfer/gemm/kernels/dense_blockscaled_gemm_sm107\.py|flashinfer/fused_moe/cute_dsl/rubin/(blockscaled_contiguous_gather_grouped_gemm_swiglu_fusion\.py|blockscaled_contiguous_grouped_gemm_finalize_fusion\.py)|flashinfer/topk_varlen/kernels/filtered_topk_(util|decode)\.py|flashinfer/topk_varlen/kernels/(gvr2_topk_decode\.py|gvr2_topk_host\.py))

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.8
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]
        exclude: ^csrc/cake_fmha/runtime/cake_fmha_qmul4\.py$

  - repo: local
    hooks:
      # The scope validator is the security boundary for `@flashinfer-bot run
      # <paths>`: its charset check is what keeps comment text from reaching a
      # shell as anything other than a test path. Its selftest covers exactly
      # that (metacharacters, command substitution, traversal, smuggled pytest
      # flags), so it runs whenever the script changes. No third-party imports,
      # so it needs no environment.
      - id: experimental-test-scope-selftest
        name: experimental test scope selftest
        entry: python3 scripts/pr_checks/experimental_test_scope.py --selftest
        language: system
        pass_filenames: false
        files: ^scripts/pr_checks/experimental_test_scope\.py$
