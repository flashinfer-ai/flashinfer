# To use:
#
#     pre-commit run -a
#
# Or:
#
#     pre-commit install  # (runs every time you commit in git)
#
# To update this file:
#
#     pre-commit autoupdate
#
# See https://github.com/pre-commit/pre-commit
# Note the pre-commit hooks shoule only be used for formatting, but not for linting.
# For linting consider using CI.

# The kernel_src */src trees and blackwell_msa CUDA snapshots are generated or
# upstream kernel drops that are re-synced periodically
# (sm100/cutedsl_megamoe, sm90/pull_style_cutedsl_megakernel);
# excluded from all hooks so formatting/lint churn doesn't block syncs or alter
# the source-distributed kernel payload.
# The shim/ layers next to them are ours and stay checked.
# The Cake selective-state and Mamba CUDA/host trees, along with frozen KDA
# fallback sources, are byte-faithful generated exports; their SHA-256 digests
# are checked by JIT manifests and must not be rewritten.
exclude: ^(?:csrc/(?:blackwell_msa/|cake_selective_state_update/(?:cuda|host)/|cake_mamba_ssd_combined/generated/|kda/training_fallback_pointer_sm_(?:100a|103a)\.cu)|flashinfer/moe_ep/kernel_src/(?:cutedsl_megamoe|sm90/pull_style_cutedsl_megakernel)/src/)

repos:
  # Standard hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-symlinks
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  # Changes tabs to spaces
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: remove-tabs
      - id: remove-crlf

  # Formatters
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.1
    hooks:
      - id: clang-format
        types_or: [c++, c, cuda]
        # Source-export directories are checksum-attested generated artifacts;
        # formatting them would break parity with their producer manifests.
        exclude: |
          (?x)^(3rdparty/.*|flashinfer/jit/aot_config.py|csrc/cake_vsa/.*)$

  -   repo: https://github.com/pre-commit/mirrors-mypy
      rev: 'v1.17.1'  # Use the sha / tag you want to point at
      hooks:
      -   id: mypy
          args: ["--config-file", "pyproject.toml", "--exclude", "flashinfer-cubin/"]
          files: ^flashinfer/
          exclude: ^(flashinfer-cubin/|flashinfer/attention/prims_ts/kernels/|3rdparty/|build/|flashinfer/cute_dsl/attention/fmha/(fmha\.py|fmha_blockscaled\.py|helpers/)|flashinfer/gemm/kernels/dense_blockscaled_gemm_sm107\.py|flashinfer/fused_moe/cute_dsl/rubin/(blockscaled_contiguous_gather_grouped_gemm_swiglu_fusion\.py|blockscaled_contiguous_grouped_gemm_finalize_fusion\.py))

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.12.8
    hooks:
      # Run the linter.
      - id: ruff-check
      # Run the formatter.
      - id: ruff-format
        types_or: [ python, pyi ]
